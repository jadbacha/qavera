  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://rhwajaceuhpfwughlgpd.supabase.co',
      'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0'
    );

    const $ = id => document.getElementById(id);
    const form = $('loginForm');
    const emailInput = $('email');
    const passwordInput = $('password');
    const message = $('message');
    let mode = 'login';

    // Where to go after signing in: ?next=checkout.html (only pages on this site).
    const nextParam = new URLSearchParams(location.search).get('next') || '';
    const nextPage = /^[a-z0-9-]+\.html$/i.test(nextParam) ? nextParam : 'home.html';
    const goNext = () => window.location.replace(`${window.location.origin}/${nextPage}`);
    const loginUrl = `${window.location.origin}/login.html${nextParam ? `?next=${encodeURIComponent(nextPage)}` : ''}`;

    function showMessage(text, ok = false) {
      message.textContent = text;
      message.classList.toggle('ok', ok);
    }

    document.querySelectorAll('.pw-toggle').forEach(button => {
      button.addEventListener('click', () => {
        const input = $(button.dataset.toggle);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        button.classList.toggle('showing', !showing);
        button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    });

    function setMode(nextMode) {
      mode = nextMode;
      showMessage('');
      const signup = mode === 'signup';
      $('tabLogin').setAttribute('aria-selected', String(!signup));
      $('tabSignup').setAttribute('aria-selected', String(signup));
      $('authKicker').textContent = signup ? 'New to QAVERA' : 'Welcome back';
      $('authTitle').innerHTML = signup ? 'Create an <em>account</em>.' : 'Sign <em>in</em>.';
      $('authIntro').textContent = signup
        ? 'Save your details for faster checkout, follow your orders and earn QAVERA Points.'
        : 'Sign in to check out faster, follow your orders and collect QAVERA Points.';
      $('submitButton').innerHTML = `${signup ? 'Create account' : 'Sign in'} <span class="arrow">→</span>`;
      $('signupFields').classList.toggle('hidden', !signup);
      $('confirmField').classList.toggle('hidden', !signup);
      $('forgotLink').classList.toggle('hidden', signup);
      passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
    }

    $('tabLogin').addEventListener('click', () => setMode('login'));
    $('tabSignup').addEventListener('click', () => setMode('signup'));
    if (location.hash === '#signup') setMode('signup');

    const capitalizeName = value => value
      .trim()
      .toLowerCase()
      .replace(/(^|[\s'-])([a-zà-ÿ])/g, (_, separator, letter) => separator + letter.toUpperCase());

    ['firstName', 'lastName'].forEach(id => $(id).addEventListener('blur', event => { event.target.value = capitalizeName(event.target.value); }));

    $('phone').addEventListener('input', event => {
      event.target.value = event.target.value.replace(/[^\d ]/g, '');
    });

    // Google OAuth
    $('googleLogin').addEventListener('click', async () => {
      showMessage('');
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: loginUrl }
      });
      if (error) showMessage(error.message);
    });

    // Email/password sign in and account creation
    form.addEventListener('submit', async event => {
      event.preventDefault();
      showMessage('');
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage('Please enter your email and password.');
        return;
      }

      const submit = $('submitButton');
      const restore = submit.innerHTML;
      submit.disabled = true;
      submit.textContent = mode === 'signup' ? 'Creating account…' : 'Signing in…';

      try {
        if (mode === 'signup') {
          const firstName = capitalizeName($('firstName').value);
          const lastName = capitalizeName($('lastName').value);
          $('firstName').value = firstName;
          $('lastName').value = lastName;
          const code = $('countryCode').value;
          const phone = $('phone').value.replace(/\D/g, '').replace(/^0+/, '');

          if (!firstName || !lastName || !phone) {
            showMessage('Please fill in your first name, last name and phone number.');
            return;
          }
          if (password.length < 6) {
            showMessage('Your password must be at least 6 characters.');
            return;
          }
          if (password !== $('confirmPassword').value) {
            showMessage('Passwords do not match.');
            return;
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: loginUrl,
              data: {
                full_name: `${firstName} ${lastName}`,
                first_name: firstName,
                last_name: lastName,
                phone,
                phone_country_code: code,
                phone_full: `${code} ${phone}`
              }
            }
          });

          if (error) {
            showMessage(error.message);
            return;
          }
          if (data.session) {
            goNext();
          } else {
            showMessage('Account created. Check your email to confirm your account, then sign in.', true);
            setMode('login');
            showMessage('Account created. Check your email to confirm your account, then sign in.', true);
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            showMessage(error.message.toLowerCase().includes('invalid login credentials')
              ? 'Invalid email or password. If you just created this account, confirm your email first.'
              : error.message);
            return;
          }
          if (data.session) goNext();
        }
      } finally {
        submit.disabled = false;
        if (!submit.textContent.endsWith('→')) submit.innerHTML = restore;
      }
    });

    // Password reset
    $('forgotLink').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage('Enter your email first, then tap "Forgot password?".');
        emailInput.focus();
        return;
      }
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/reset-password.html`
      });
      if (error) showMessage(error.message);
      else showMessage('Password reset instructions have been sent to your email.', true);
    });

    // Already signed in (or just back from Google): continue.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) goNext();
    });
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) goNext();
    });
  </script>
