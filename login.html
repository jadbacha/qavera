<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | QAVERA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0D0B08;
      --beige: #F5EDD9;
      --gold: #C9A84C;
      --gold-light: #DCC58A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--beige);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 430px;
      height: 52px;
      margin: 0 auto 50px;
      text-decoration: none;
      line-height: 0;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: contain;
    }

    .subtitle {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(245, 237, 217, 0.55);
      margin-bottom: 45px;
    }

    .login-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 30px;
    }

    .google-button-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    .google-btn {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(201, 168, 76, 0.45);
      background: transparent;
      color: var(--beige);
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .google-btn:hover {
      background: rgba(201, 168, 76, 0.08);
      border-color: var(--gold);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
      color: rgba(245, 237, 217, 0.4);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
    }

    .divider::before,
    .divider::after {
      content: '';
      height: 1px;
      flex: 1;
      background: rgba(201, 168, 76, 0.2);
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .signup-profile-fields {
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      .phone-wrap {
        grid-template-columns: 145px 1fr;
        gap: 8px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(245, 237, 217, 0.65);
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid rgba(245, 237, 217, 0.18);
      background: rgba(255, 255, 255, 0.02);
      color: var(--beige);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: var(--gold);
    }

    .form-group input::placeholder {
      color: rgba(245, 237, 217, 0.3);
    }

    .phone-wrap {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 10px;
    }

    .phone-wrap select {
      width: 100%;
      height: 52px;
      padding: 0 12px;
      border: 1px solid rgba(245, 237, 217, 0.18);
      background: #0f0e0d;
      color: #f5edd9;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .phone-wrap select:focus {
      border-color: var(--gold);
    }

    .phone-wrap select option {
      background: #0f0e0d;
      color: #f5edd9;
    }

    .phone-wrap input {
      min-width: 0;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(245, 237, 217, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: var(--gold);
    }

    .eye-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eye-slash {
      opacity: 1;
      transition: opacity 0.15s ease;
    }

    .password-toggle.is-visible .eye-slash {
      opacity: 0;
    }

    .signin-btn {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signin-btn:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .links {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .links a {
      color: rgba(245, 237, 217, 0.65);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: var(--gold);
    }

    .message {
      margin-top: 20px;
      min-height: 20px;
      font-size: 0.7rem;
      color: var(--gold-light);
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 22px;
      }

      .logo {
        width: 80vw;
        max-width: 430px;
        height: 42px;
        margin: 10px auto 40px;
      }

      .logo img {
        width: 100%;
        height: 200px;
        object-fit: contain;
      }

      .login-title {
        font-size: 2.2rem;
      }
    }
  
    /* Keep signup names visually capitalized. */
    #firstName,
    #lastName {
      text-transform: capitalize;
    }

</style>
</head>

    <div class="message" id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://rhwajaceuhpfwughlgpd.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const message = document.getElementById('message');
  const title = document.querySelector('.login-title');
  const submitButton = document.querySelector('.signin-btn');
  const createLink = document.querySelector('.links a:first-child');
  const forgotLink = document.querySelector('.links a:last-child');
  const passwordToggle = document.getElementById('passwordToggle');
  const signupProfileFields = document.getElementById('signupProfileFields');
  const firstNameInput = document.getElementById('firstName');
  const lastNameInput = document.getElementById('lastName');
  const phoneInput = document.getElementById('phone');
  const countryCodeInput = document.getElementById('countryCode');

  let mode = 'login';

  passwordToggle?.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    passwordToggle.classList.toggle('is-visible', !showing);
    passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    passwordToggle.setAttribute('title', showing ? 'Show password' : 'Hide password');
  });

  function showMessage(text) {
    message.textContent = text;
  }

  function addConfirmPassword() {
    if (document.getElementById('confirmPassword')) return;

    const group = document.createElement('div');
    group.className = 'form-group';
    group.id = 'confirmPasswordGroup';
    group.innerHTML = `
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
      >
    `;

    const submit = document.querySelector('.signin-btn');
    submit.parentNode.insertBefore(group, submit);
  }

  function removeConfirmPassword() {
    const group = document.getElementById('confirmPasswordGroup');
    if (group) group.remove();
  }

  function setMode(nextMode) {
    mode = nextMode;
    showMessage('');

    if (mode === 'signup') {
      title.textContent = 'Create Account';
      submitButton.textContent = 'Create Account';
      createLink.textContent = 'Back to Sign In';
      forgotLink.style.display = 'none';
      signupProfileFields.style.display = '';
      firstNameInput.required = true;
      lastNameInput.required = true;
      phoneInput.required = true;
      addConfirmPassword();
    } else {
      title.textContent = 'Welcome Back';
      submitButton.textContent = 'Sign In';
      createLink.textContent = 'Create New Account';
      forgotLink.style.display = '';
      signupProfileFields.style.display = 'none';
      firstNameInput.required = false;
      lastNameInput.required = false;
      phoneInput.required = false;
      removeConfirmPassword();
    }
  }

  // Google OAuth
  document.getElementById('googleLogin').addEventListener('click', async () => {
    showMessage('');

    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/login.html'
      }
    });

    if (error) showMessage(error.message);
  });

  // Email/password login and account creation
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    showMessage('');

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (mode === 'signup') {
      const capitalizeName = (value) =>
        value
          .trim()
          .toLowerCase()
          .replace(/(^|[\s'-])([a-zà-ÿ])/g, (_, separator, letter) =>
            separator + letter.toUpperCase()
          );

      const firstName = capitalizeName(firstNameInput.value);
      const lastName = capitalizeName(lastNameInput.value);

      // Keep the fields themselves normalized too.
      firstNameInput.value = firstName;
      lastNameInput.value = lastName;

      const phone = phoneInput.value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!firstName || !lastName || !phone) {
        showMessage('Please fill in your first name, last name, and phone number.');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin + '/login.html',
          data: {
            first_name: firstName,
            last_name: lastName,
            phone: phone,
            phone_country_code: countryCodeInput.value,
            phone_full: `${countryCodeInput.value} ${phone}`
          }
        }
      });

      if (error) {
        if (error.message.toLowerCase().includes('invalid login credentials')) {
          showMessage('Invalid email or password. If you just created this account, confirm your email first.');
        } else {
          showMessage(error.message);
        }
        return;
      }

      if (data.session) {
        window.location.replace(window.location.origin + '/home.html');
      } else {
        showMessage('Account created. Check your email to confirm your account.');
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
        return;
      }

      if (data.session) {
        window.location.replace(window.location.origin + '/home.html');
      }
    }
  });

  // Create account / back to sign in
  createLink.addEventListener('click', (event) => {
    event.preventDefault();
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  // Password reset
  forgotLink.addEventListener('click', async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
      showMessage('Enter your email first, then click Forgot Password.');
      emailInput.focus();
      return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    if (error) {
      showMessage(error.message);
    } else {
      showMessage('Password reset instructions have been sent to your email.');
    }
  });

  // If the user is already authenticated, keep them out of the login page.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
      window.location.replace(window.location.origin + '/home.html');
    }
  });

  // Also handle a fresh OAuth session.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
      window.location.replace(window.location.origin + '/home.html');
    }
  });

  console.log('Supabase authentication ready');
</script>
</body>
</html>
