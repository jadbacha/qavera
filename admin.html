<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QAVERA — Orders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* QAVERA v3 palette */
      --beige: #D8D8D8;
      --beige-light: #E6E5E3;
      --beige-mid: #CFCECC;
      --black: #0F0E0E;
      --gold: #C4A980;
      --gold-light: #C4A980;
      --gold-dark: #3D030A;
      --text-dark: #0F0E0E;
      --text-muted: rgba(15,14,14,.66);
      --border: rgba(15,14,14,.16);
      --serif: 'Bodoni Moda', Georgia, serif;
      --sans: 'Instrument Sans', system-ui, sans-serif;
      --mono: 'DM Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--beige);
      color: var(--text-dark);
      font-family: var(--sans);
      font-weight: 400;
      min-height: 100vh;
    }

    header {
      background: var(--black);
      color: var(--beige);
      padding: 18px 16px;
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      color: var(--gold);
      text-decoration: none;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .ghost-button {
      background: transparent;
      border: 1px solid rgba(201,168,76,.45);
      color: var(--gold-light);
      font-family: var(--sans);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }

    .ghost-button:hover { border-color: var(--gold); }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 60px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.4rem;
      margin-bottom: 4px;
    }

    .subtitle { color: var(--text-muted); font-size: .8rem; margin-bottom: 24px; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .filter {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }

    .filter.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--gold-light);
    }

    .filter .count { opacity: .7; margin-left: 4px; }

    /* Day filter + print */
    .day-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -8px 0 22px; }
    .day-bar label { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-right: 2px; }
    .day-bar input { font: inherit; font-size: .85rem; padding: 7px 10px; border: 1px solid var(--border); background: transparent; color: inherit; }
    .day-bar .print-button { margin-left: auto; background: var(--black); border-color: var(--black); color: var(--gold-light); }
    .day-bar[hidden] { display: none; }
    .print-title { display: none; }

    @media print {
      @page { margin: 12mm; }
      body { background: #fff !important; }
      header, .subtitle, .filters, .day-bar, .actions, .contact-links { display: none !important; }
      main { padding: 0 !important; max-width: none !important; }
      main > h1 { display: none; }
      .print-title { display: block; font-family: var(--serif, Georgia, serif); font-weight: 400; font-size: 20px; margin: 0 0 12px; }
      .order-list { gap: 10px; }
      .order { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; border: 1px solid #bbb !important; background: #fff !important; }
    }

    .notice {
      border: 1px dashed rgba(26,23,19,.2);
      background: rgba(235,224,196,.3);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: .85rem;
      line-height: 1.7;
    }

    .notice h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .notice a { color: var(--gold-dark); }

    .order-list { display: grid; gap: 16px; }

    .order {
      background: var(--beige-light);
      border: 1px solid var(--border);
      padding: 22px;
    }

    .order.is-new { border-left: 3px solid var(--gold); }

    .order-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 14px;
    }

    .order-number { font-family: var(--serif); font-size: 1.5rem; }

    .order-time { color: var(--text-muted); font-size: .72rem; margin-top: 2px; }
    .order-when { display: inline-block; margin-top: 8px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; background: #1A2D28; color: #F5EDD9; }
    .order-when.is-pickup { background: #3D030A; }

    .status {
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid rgba(201,168,76,.5);
      color: var(--gold-dark);
      white-space: nowrap;
    }

    .status.pending { background: var(--gold); border-color: var(--gold); color: var(--black); }
    .status.delivered { background: var(--black); border-color: var(--black); color: var(--gold-light); }
    .status.cancelled { color: var(--text-muted); border-color: var(--border); text-decoration: line-through; }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 28px;
    }

    @media (max-width: 680px) {
      .order-grid { grid-template-columns: 1fr; }
    }

    .block-label {
      color: var(--gold-dark);
      font-size: .6rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .block { font-size: .85rem; line-height: 1.7; }

    .block .muted { color: var(--text-muted); }

    .block a { color: var(--text-dark); }

    .contact-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }

    .contact-links a {
      color: var(--gold-dark);
      font-size: .72rem;
      letter-spacing: .08em;
      text-decoration: none;
      border-bottom: 1px solid rgba(154,122,46,.4);
    }

    .address { white-space: pre-line; }

    .items { list-style: none; }

    .items li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: .85rem;
    }

    .items li > span:last-child { white-space: nowrap; }

    .custom-box {
      display: block;
      margin: 8px 0 4px;
      padding: 10px 12px;
      max-width: 260px;
      background: rgba(201,168,76,.12);
      border-left: 2px solid var(--gold);
      font-size: .78rem;
      white-space: normal;
    }

    .flavor-row { display: flex; justify-content: space-between; gap: 18px; line-height: 1.7; }

    .flavor-row strong { font-weight: 500; }

    .custom-label {
      display: block;
      color: var(--gold-dark);
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .totals { margin-top: 8px; font-size: .8rem; }

    .totals div { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-muted); }

    .totals .grand { color: var(--text-dark); font-weight: 500; font-size: .9rem; padding-top: 4px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .action {
      font-family: var(--sans);
      font-size: .65rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 11px 16px;
      cursor: pointer;
      border: 1px solid var(--black);
      background: transparent;
      color: var(--black);
    }

    .action.primary { background: var(--black); color: var(--gold-light); }

    .action.danger { border-color: rgba(26,23,19,.25); color: var(--text-muted); margin-left: auto; }

    .action.danger.armed { background: #7a2e1f; border-color: #7a2e1f; color: #fff; }

    .action:disabled { opacity: .5; cursor: wait; }

    .order-message { width: 100%; font-size: .75rem; color: #7a2e1f; }

    .final-note { color: var(--text-muted); font-size: .75rem; }

    /* v3 details */
    .ghost-button, .filter, .block-label, .status, .action, .order-time, .subtitle, .contact-links a, .final-note { font-family: var(--mono); }
    .brand { font-family: var(--serif); letter-spacing: .28em; }
    h1 { font-weight: 400; }
    .order-number { font-weight: 400; }
    .status.pending { background: var(--black); border-color: var(--black); color: var(--gold); }
    .status.delivered { background: #1A2D28; border-color: #1A2D28; color: var(--beige); }
    .custom-box { background: rgba(61,3,10,.07); border-left-color: var(--gold-dark); }
    .order.is-new { border-left-color: var(--gold); }

    /* Stock tab */
    .stock-intro { margin: 0 0 18px; color: var(--muted, #6f6a64); font-size: 14px; line-height: 1.5; }
    .stock-message { color: #b00020; font-size: 14px; min-height: 1em; margin-bottom: 8px; }
    .stock-group { margin-bottom: 26px; }
    .stock-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
    .stock-name { font-size: 15px; }
    .stock-state { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #2e7d32; }
    .sales-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
    .sales-bar label { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .sales-bar input[type=date] { font: inherit; font-size: .85rem; padding: 7px 10px; border: 1px solid var(--border); background: transparent; color: var(--text-dark); letter-spacing: 0; text-transform: none; }
    .sales-check { cursor: pointer; }
    .sales-range { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; margin-bottom: 12px; }
    .sales-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .sales-card { background: var(--beige-light); border: 1px solid var(--border); padding: 12px 14px; display: grid; gap: 2px; }
    .sales-card span { font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
    .sales-card strong { font-size: 1.15rem; }
    .sales-card.big { background: var(--black); color: var(--gold-light); }
    .sales-card.big span, .sales-card.big em { color: rgba(196,169,128,.75); }
    .sales-card em { font-style: normal; font-size: .75rem; }
    .sales-methods { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--text-muted); margin-bottom: 14px; }
    .sales-methods b { color: var(--text-dark); font-weight: 600; }
    .sales-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .sales-actions .action { margin: 0; }
    .sales-table-wrap { overflow-x: auto; background: var(--beige-light); border: 1px solid var(--border); }
    .sales-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    .sales-table th { text-align: left; font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--black); white-space: nowrap; }
    .sales-table td { padding: 9px 10px; border-bottom: 1px solid rgba(0,0,0,.07); white-space: nowrap; }
    .sales-table .r { text-align: right; }
    .sales-table tfoot td { font-weight: 700; border-top: 1px solid var(--black); border-bottom: 0; }
    .sales-table tr.is-cancelled td { color: var(--text-muted); text-decoration: line-through; }
    .pay-state { font-size: .72rem; padding: 2px 8px; border: 1px solid; white-space: nowrap; }
    .pay-state.paid { color: #2e7d32; } .pay-state.unpaid { color: #b26a00; } .pay-state.cancelled { color: var(--text-muted); }
    @media print { .sales-bar, .sales-actions { display: none !important; } .sales-table-wrap { overflow: visible; border: 0; } }
    .area-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .area-add input, .area-row input { font: inherit; font-size: .9rem; padding: 8px 10px; border: 1px solid var(--border); background: #fff; color: inherit; }
    .area-add #newAreaName { flex: 1 1 200px; }
    .area-add #newAreaFee, .area-row input { width: 90px; }
    .area-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
    .area-row .action { margin: 0; padding: 8px 12px; }
    .area-row .action.danger { margin-left: 0; }
    .stock-message.ok { color: #2e7d32; }
    @media (max-width: 560px) { .area-row { grid-template-columns: 1fr auto; } }
    .stock-row.is-out .stock-name { opacity: .55; text-decoration: line-through; }
    .stock-row.is-out .stock-state { color: #b00020; }
    .stock-row .action { margin: 0; white-space: nowrap; }
    @media (max-width: 560px) {
      .stock-row { grid-template-columns: 1fr auto; }
      .stock-row .action { grid-column: 1 / -1; justify-self: start; }
    }

    /* New order (WhatsApp / phone) */
    .new-order { background: var(--beige-light); border: 1px solid var(--border); padding: 22px; display: grid; gap: 22px; }
    .no-section { display: grid; gap: 10px; }
    .no-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .no-field { display: grid; gap: 4px; }
    .no-field label, .no-section > .block-label { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
    .no-field input, .no-field select, .no-field textarea { font: inherit; font-size: .9rem; padding: 9px 10px; border: 1px solid var(--border); background: #fff; color: inherit; width: 100%; }
    .no-choice { display: flex; flex-wrap: wrap; gap: 8px; }
    .no-choice label { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); background: #fff; font-size: .85rem; cursor: pointer; }
    .no-choice label:has(input:checked) { border-color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }
    .no-add { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; align-items: end; }
    .no-items { list-style: none; display: grid; gap: 6px; }
    .no-items li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; padding: 8px 10px; background: #fff; border: 1px solid var(--border); }
    .no-items button { border: 0; background: none; color: #7a2e1f; cursor: pointer; font: inherit; font-size: .75rem; text-decoration: underline; }
    .dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    .dc-card { background: #fff; border: 1px solid var(--border); padding: 18px; }
    .dc-card h3 { margin: 0 0 10px; font-size: 1rem; }
    .dc-card .sales-table td { padding: 7px 4px; }
    .dc-zero td { color: #aaa; }
    .dc-day { cursor: pointer; } .dc-day:hover td { background: #faf6ee; }
    .dc-note { color: #888; font-size: .78rem; margin: 6px 0 0; }
    .dc-out { list-style: none; margin: 0; padding: 0; }
    .dc-out li { padding: 6px 0; border-bottom: 1px solid #f0ebe0; font-size: .9rem; }
    .dc-out li b { color: #b00020; margin-right: 6px; }
    .dc-out li b.dc-ok { color: #2e7d32; }
    .dc-out li span { display: block; color: #888; font-size: .75rem; }
    .dc-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #f0ebe0; font-size: .9rem; }
    .dc-total { font-weight: 700; border-bottom: 1.5px solid #1a1713; }
    .dc-minus { color: #b00020; } .dc-ok { color: #2e7d32; } .dc-over { color: #1565c0; }
    @media (max-width: 760px) { .dc-grid { grid-template-columns: 1fr; } }
    .cust-field { position: relative; }
    .cust-suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin: 2px 0 0; padding: 4px 0; list-style: none; background: #fff; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
    .cust-suggest button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; font: inherit; font-size: .85rem; }
    .cust-suggest button:hover { background: #f4efe4; }
    .cust-suggest span { color: #555; margin-left: 6px; }
    .cust-suggest em { display: block; font-style: normal; color: #888; font-size: .75rem; margin-top: 2px; }
    .no-disc { display: flex; gap: 6px; }
    .no-disc select { width: auto; flex: none; }
    .no-disc input { flex: 1; min-width: 0; }
    .no-items li { flex-wrap: wrap; }
    .no-item-disc { flex-basis: 100%; }
    .no-item-disc button { text-decoration: none; border: 1px solid var(--border); padding: 4px 10px; color: inherit; background: #fff; }
    .item-disc { display: block; color: #2e7d32; font-size: .78rem; margin-top: 2px; }
    .no-totals { font-size: .9rem; display: grid; gap: 4px; max-width: 360px; margin-left: auto; width: 100%; }
    .no-totals div { display: flex; justify-content: space-between; }
    .no-totals .grand { font-weight: 600; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }
    .no-check { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
    .no-flavours { border: 1px solid var(--border); background: #fff; padding: 12px 14px; display: grid; gap: 6px; }
    .no-flavours[hidden] { display: none; }
    .no-flv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; margin-bottom: 4px; }
    .no-flv-head span { color: var(--text-muted); margin-right: auto; }
    .no-flv-head button, .no-flv-row button { font: inherit; font-size: .8rem; border: 1px solid var(--border); background: #fff; padding: 4px 10px; cursor: pointer; }
    .no-flv-row { display: grid; grid-template-columns: 1fr 34px 34px 34px; align-items: center; gap: 6px; font-size: .88rem; }
    .no-flv-row b { text-align: center; }
    .no-flv-row button:disabled { opacity: .35; cursor: default; }
    .no-flv-note { font-size: .8rem; color: #7a2e1f; min-height: 1em; }
    .no-flv-list { display: block; color: var(--text-muted); font-size: .78rem; }
    .no-message { font-size: .85rem; color: #7a2e1f; min-height: 1em; }
    .no-message.ok { color: #2e7d32; }
    .new-order [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .no-grid { grid-template-columns: 1fr; }
      .no-add { grid-template-columns: 1fr 70px; }
      .no-add .action { grid-column: 1 / -1; }
    }
    /* Gifts and Fawran */
    .gift-tag { display: inline-block; margin: 8px 0 0 6px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; background: var(--gold); color: var(--black); }
    .pay-tag { display: inline-block; margin: 8px 0 0 6px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; border: 1px solid #7a2e1f; color: #7a2e1f; }
    .pay-tag.paid { border-color: #2e7d32; color: #2e7d32; }
    .gift-card { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--gold); background: rgba(196,169,128,.12); font-style: italic; white-space: pre-line; }
    .wa-row { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .wa-label { font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
    .wa-send { font-family: var(--sans); font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; padding: 9px 14px; border: 1px solid #1f8f4e; color: #1f8f4e; text-decoration: none; background: transparent; }
    .wa-send::before { content: '💬 '; }
    .delete-btn { border-color: rgba(122,46,31,.5); color: #7a2e1f; }
    .delete-btn.armed { background: #7a2e1f; border-color: #7a2e1f; color: #fff; }
    .edit-intro { color: var(--text-dark) !important; background: #fff6df; border: 1px solid var(--gold); padding: 10px 12px; }
    .link-btn { font: inherit; font-size: .72rem; border: 0; background: none; color: var(--text-muted); text-decoration: underline; cursor: pointer; padding: 4px 0; }
    .pay-change { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); background: #fff; }
    .pay-change[hidden] { display: none; }
    .pay-change select { font: inherit; font-size: .85rem; padding: 7px 10px; border: 1px solid var(--border); background: #fff; }
    .pay-change label { font-size: .85rem; display: flex; align-items: center; gap: 6px; }
    .pay-change .action { margin: 0; }
    .invoice-btn { font-family: var(--sans); font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; padding: 9px 14px; border: 1px solid var(--black); color: var(--black); background: transparent; cursor: pointer; margin-right: 8px; }
    .action.paid-button { border-color: #2e7d32; color: #2e7d32; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="home.html">QAVERA</a>
      <div class="header-actions">
        <button class="ghost-button" id="refreshButton" type="button">Refresh</button>
        <button class="ghost-button" id="logoutButton" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <h1>Orders</h1>
    <p class="subtitle" id="subtitle">Loading…</p>

    <div class="filters" id="filters" hidden></div>
    <div class="day-bar" id="dayBar" hidden>
      <label for="dayFrom">From</label>
      <input type="date" id="dayFrom">
      <label for="dayTo">To</label>
      <input type="date" id="dayTo">
      <button type="button" class="filter" data-day="today">Today</button>
      <button type="button" class="filter" data-day="tomorrow">Tomorrow</button>
      <button type="button" class="filter" data-day="">All days</button>
      <button type="button" class="filter print-button" id="printButton">Print these orders</button>
    </div>
    <h2 class="print-title" id="printTitle"></h2>
    <div id="content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const adminSupabase = window.supabase.createClient(
      'https://rhwajaceuhpfwughlgpd.supabase.co',
      'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0'
    );

    const STATUS_LABELS = {
      pending: 'New',
      confirmed: 'Confirmed',
      preparing: 'Preparing',
      out_for_delivery: 'Out for delivery',
      delivered: 'Delivered',
      cancelled: 'Cancelled'
    };

    // The normal order of steps; the primary button moves an order one step forward.
    const FLOW = ['pending', 'confirmed', 'preparing', 'out_for_delivery', 'delivered'];

    const ACTION_LABELS = {
      confirmed: 'Confirm',
      preparing: 'Preparing',
      out_for_delivery: 'Out for delivery',
      delivered: 'Delivered'
    };

    // Pickup orders use the same steps with pickup wording.
    const PICKUP_STATUS_LABELS = { out_for_delivery: 'Ready for pickup', delivered: 'Collected' };
    const PICKUP_ACTION_LABELS = { out_for_delivery: 'Ready for pickup', delivered: 'Collected' };
    const SLOT_LABELS = {
      '12:00-16:00': '12 PM – 4 PM', '18:00-23:00': '6 PM – 11 PM',
      '10:00-14:00': '10 AM – 2 PM', '16:00-21:00': '4 PM – 9 PM', '13:00-18:00': '1 PM – 6 PM'
    };
    const isPickup = order => order.fulfillment_type === 'pickup';
    const statusLabel = order => (isPickup(order) && PICKUP_STATUS_LABELS[order.status]) || STATUS_LABELS[order.status] || order.status;
    const actionLabel = (order, status) => (isPickup(order) && PICKUP_ACTION_LABELS[status]) || ACTION_LABELS[status];

    function scheduleLabel(order) {
      if (!order.scheduled_date) return '';
      const date = new Date(`${order.scheduled_date}T12:00:00Z`).toLocaleDateString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
      });
      return `${date} · ${SLOT_LABELS[order.time_slot] || order.time_slot || ''}`;
    }

    const FILTERS = [
      // Card online orders show up once they are paid (unpaid ones stay in All).
      { key: 'active', label: 'To do', match: o => !isShopSale(o) && !['delivered', 'cancelled'].includes(o.status) && !cardUnpaid(o) },
      { key: 'delivered', label: 'Delivered', match: o => !isShopSale(o) && o.status === 'delivered' },
      { key: 'cancelled', label: 'Cancelled', match: o => o.status === 'cancelled' },
      { key: 'shop', label: 'Shop sales', match: o => isShopSale(o) && o.status !== 'cancelled' },
      { key: 'all', label: 'All', match: () => true },
      { key: 'stock', label: 'Stock', match: () => false },
      { key: 'sales', label: 'Sales', match: () => false },
      { key: 'dayclose', label: 'Day close', match: () => false },
      { key: 'areas', label: 'Delivery areas', match: () => false },
      { key: 'new', label: '+ New order', match: () => false }
    ];

    // Products on sale, for the Stock tab. null = could not load (SQL 015 not run yet).
    let products = [];
    const STOCK_GROUPS = [
      { label: 'Boxes', match: p => !p.category },
      { label: 'Wrapped Chocolate', match: p => p.category === 'assorted' },
      { label: 'Slabs', match: p => p.category === 'slabs' },
      { label: 'Spreads', match: p => p.category === 'spreads' },
      { label: 'Other', match: p => !!p.category && !['assorted', 'slabs', 'spreads'].includes(p.category) }
    ];

    const PAYMENT_LABELS = {
      cash_on_delivery: 'Cash on delivery',
      card_on_delivery: 'Card on delivery',
      fawran: 'Fawran',
      card_online: 'Card online',
      cash: 'Cash in shop',
      card: 'Card in shop'
    };

    // Sales made in the shop with the POS app.
    const isShopSale = order => order.source === 'store';
    // Customer chose to pay online by card but has not paid (yet).
    const cardUnpaid = order => order.payment_method === 'card_online' && order.payment_status !== 'paid';

    let orders = [];
    let activeFilter = 'active';
    // Date range (YYYY-MM-DD, Qatar). Empty = no limit on that side.
    let dayFrom = '';
    let dayTo = '';

    // Day an order belongs to: its delivery / pickup date, or for shop sales the day it was sold.
    const qatarDay = value => new Date(value).toLocaleDateString('en-CA', { timeZone: 'Asia/Qatar' });
    const orderDay = order => order.scheduled_date || qatarDay(order.created_at);
    const dayMatch = order => {
      const day = orderDay(order);
      return (!dayFrom || day >= dayFrom) && (!dayTo || day <= dayTo);
    };
    function qatarDayOffset(days) {
      const d = new Date(`${qatarDay(Date.now())}T12:00:00Z`);
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    const dayLabel = day => new Date(`${day}T12:00:00Z`).toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
    });
    function rangeLabel() {
      if (!dayFrom && !dayTo) return 'All days';
      if (dayFrom && dayFrom === dayTo) return dayLabel(dayFrom);
      if (dayFrom && dayTo) return `${dayLabel(dayFrom)} to ${dayLabel(dayTo)}`;
      return dayFrom ? `From ${dayLabel(dayFrom)}` : `Until ${dayLabel(dayTo)}`;
    }
    let isAdmin = false;

    const content = document.getElementById('content');
    const subtitle = document.getElementById('subtitle');
    const filtersEl = document.getElementById('filters');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function qar(value) {
      const amount = Number(value || 0);
      return `QAR ${Number.isInteger(amount) ? amount : amount.toFixed(2)}`;
    }

    function formatTime(value) {
      if (!value) return '';
      return new Date(value).toLocaleString('en-GB', {
        timeZone: 'Asia/Qatar',
        weekday: 'short', day: 'numeric', month: 'short',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function showNotice(title, text) {
      filtersEl.hidden = true;
      content.innerHTML = `<div class="notice"><h2>${escapeHtml(title)}</h2><p>${text}</p></div>`;
    }

    async function init() {
      const { data: { session } } = await adminSupabase.auth.getSession();

      if (!session) {
        window.location.replace('login.html?next=admin.html');
        return;
      }

      const { data: allowed, error } = await adminSupabase.rpc('is_admin');

      if (error || !allowed) {
        subtitle.textContent = '';
        showNotice('Not available', 'This page is only for QAVERA staff. <a href="home.html">Back to the shop</a>');
        return;
      }

      isAdmin = true;
      await loadOrders();

      // Keep the list fresh while the page is open.
      setInterval(() => { if (!document.hidden) loadOrders(); }, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) loadOrders(); });
    }

    async function loadOrders() {
      if (!isAdmin) return;

      const productsRequest = adminSupabase
        .from('products').select('id, name, category, in_stock').eq('active', true).order('name');

      const { data, error } = await adminSupabase
        .from('orders')
        .select('*, order_items(*)')
        .order('created_at', { ascending: false })
        .limit(300);

      if (error) {
        console.error('Could not load orders:', error);
        showNotice('Could not load orders', escapeHtml(error.message));
        return;
      }

      orders = data || [];
      checkRecentCardPayments();
      const productsResult = await productsRequest;
      products = productsResult.error ? null : (productsResult.data || []);
      const updated = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Qatar', hour: '2-digit', minute: '2-digit' });
      subtitle.textContent = `${orders.length} order${orders.length === 1 ? '' : 's'} · updated ${updated}`;
      render();
    }

    // Online card payments: ask Noqoody whether the order was paid.
    async function checkCardPayment(button) {
      const message = document.getElementById(`msg-${button.dataset.cardcheck}`);
      button.disabled = true;
      button.textContent = 'Checking…';
      const { data, error } = await adminSupabase.functions.invoke('card-payment', {
        body: { action: 'check', order_id: button.dataset.cardcheck }
      }).catch(error => ({ error }));
      if (data?.status === 'paid') { loadOrders(); return; }
      button.disabled = false;
      button.textContent = '🔄 Check card payment';
      if (message) {
        message.textContent = error || data?.error ? 'Could not check the payment. Try again in a moment.'
          : data?.status === 'failed' ? 'Not paid: the card payment failed.' : 'Not paid yet: the customer has not completed the card payment.';
      }
    }

    // Once per page load: card orders from the last 2 days that are not paid
    // yet (in case the customer paid and closed the page before coming back).
    let cardChecksDone = false;
    async function checkRecentCardPayments() {
      if (cardChecksDone) return;
      cardChecksDone = true;
      const since = Date.now() - 2 * 24 * 3600 * 1000;
      const recent = orders.filter(o => cardUnpaid(o) && o.status !== 'cancelled' && new Date(o.created_at).getTime() > since);
      if (!recent.length) return;
      const results = await Promise.all(recent.map(o => adminSupabase.functions.invoke('card-payment', {
        body: { action: 'check', order_id: o.id }
      }).then(r => r.data?.status).catch(() => null)));
      if (results.includes('paid')) loadOrders();
    }

    function renderFilters() {
      filtersEl.hidden = false;
      filtersEl.innerHTML = FILTERS.map(filter => {
        const count = filter.key === 'stock'
          ? (products || []).filter(p => p.in_stock === false).length
          : orders.filter(o => dayMatch(o) && filter.match(o)).length;
        const countLabel = ['new', 'areas', 'sales'].includes(filter.key) ? '' : filter.key === 'stock' ? (count ? `${count} sold out` : '') : count;
        return `<button type="button" class="filter ${filter.key === activeFilter ? 'active' : ''}" data-filter="${filter.key}">
          ${filter.label}<span class="count">${countLabel}</span>
        </button>`;
      }).join('');
    }

    // ---- WhatsApp: the same messages as the emails, ready to send ----
    const SHOP_ADDRESS = 'QAVERA shop, Zone 55, Street 162, Building 44';
    const FAWRAN_DETAILS = 'Corporate · Qavera Trading · CR 237335';
    // Phone in international form for wa.me; 8-digit numbers are Qatari.
    function waDigits(phone) {
      const digits = String(phone || '').replace(/\D/g, '').replace(/^00/, '');
      return digits.length === 8 ? `974${digits}` : digits;
    }
    const waFirstName = name => String(name || '').trim().split(/\s+/)[0] || '';
    function waWhen(order) {
      if (!order.scheduled_date) return '';
      const date = new Date(`${order.scheduled_date}T12:00:00Z`).toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
      });
      return `${date}, ${SLOT_LABELS[order.time_slot] || order.time_slot || ''}`;
    }
    function waPayment(order) {
      const label = PAYMENT_LABELS[order.payment_method] || order.payment_method;
      return isPickup(order) ? label.replace('delivery', 'pickup') : label;
    }

    // Messages that fit the order's current step: [{ label, phone, text }].
    function waMessages(order) {
      if (isShopSale(order) || order.status === 'cancelled') return [];
      const hello = `Hello ${waFirstName(order.customer_name)},`.replace(' ,', ',');
      const number = order.order_number;
      const total = `Total: ${qar(order.total)} (${waPayment(order)})`;
      const when = waWhen(order);
      const kind = isPickup(order) ? 'Pickup' : 'Delivery';
      const fawranDue = order.payment_method === 'fawran' && order.payment_status !== 'paid';
      const fawranText = `Please send ${qar(order.total)} by Fawran to ${FAWRAN_DETAILS}, with ${number} in the note. We will prepare your order as soon as we receive it.`;
      const gift = order.is_gift ? `\nGift for: ${order.gift_recipient_name}` : '';
      const list = [];

      if (order.status === 'pending' || order.status === 'confirmed' || order.status === 'preparing') {
        const opening = order.status === 'pending'
          ? `Thank you for your QAVERA order ${number}.`
          : `Your QAVERA order ${number} is confirmed.`;
        list.push({
          label: order.status === 'pending' ? 'Order received' : 'Order confirmed',
          text: `${hello}\n\n${opening}${gift}${when ? `\n${kind}: ${when}` : ''}\n${total}${fawranDue ? `\n\n${fawranText}` : ''}\n\nQAVERA`
        });
      }
      if (order.status === 'out_for_delivery') {
        list.push(isPickup(order)
          ? { label: 'Ready for pickup', text: `${hello}\n\nYour QAVERA order ${number} is ready to collect${when ? ` on ${when}` : ''}.\n${SHOP_ADDRESS}\n${total}\n\nQAVERA` }
          : { label: 'On its way', text: `${hello}\n\nYour QAVERA order ${number} is out for delivery${order.is_gift ? ` to ${order.gift_recipient_name}` : ' and will reach you soon'}.\n${total}\n\nQAVERA` });
        if (order.is_gift && order.gift_recipient_phone) {
          list.push({
            label: 'Tell the recipient',
            phone: order.gift_recipient_phone,
            text: `Hello ${waFirstName(order.gift_recipient_name)},\n\nA QAVERA gift from ${order.customer_name} is on its way to you and will arrive soon.${order.gift_message ? `\n\n“${order.gift_message}”` : ''}\n\nQAVERA`
          });
        }
      }
      if (order.status === 'delivered') {
        const points = Number(order.points_earned || 0);
        list.push({
          label: isPickup(order) ? 'Collected' : 'Delivered',
          text: `${hello}\n\nYour QAVERA order ${number} has been ${isPickup(order) ? 'collected' : 'delivered'}. Thank you for choosing QAVERA.${points > 0 ? `\nYou earned ${points} QAVERA points with this order.` : ''}\n\nQAVERA`
        });
      }
      if (order.payment_method === 'fawran') {
        list.push(fawranDue
          ? { label: 'Fawran reminder', text: `${hello}\n\n${fawranText}\n\nOrder ${number}\n\nQAVERA` }
          : { label: 'Fawran received', text: `${hello}\n\nWe have received your Fawran payment of ${qar(order.total)} for order ${number}. Thank you!\n\nQAVERA` });
      }

      return list
        .map(m => ({ ...m, digits: waDigits(m.phone || order.customer_phone) }))
        .filter(m => m.digits.length >= 8);
    }

    function renderWhatsApp(order) {
      if (isShopSale(order) || order.status === 'cancelled') return '';
      const messages = waMessages(order);
      return `<div class="wa-row">
        <button type="button" class="invoice-btn" data-invoice="${order.id}">🧾 Print receipt / invoice</button>
        ${messages.length ? `<span class="wa-label">WhatsApp</span>${messages.map(m =>
          `<a class="wa-send" href="https://wa.me/${m.digits}?text=${encodeURIComponent(m.text)}" target="_blank" rel="noopener">${escapeHtml(m.label)}</a>`
        ).join('')}` : ''}
      </div>`;
    }

    // ---- Invoice / receipt: the same A4 page as the till prints ----
    // "Receipt" once the order is paid, "Invoice" before. The logo is embedded
    // so a saved PDF is complete on its own.
    let invoiceLogo = `${location.origin}/receipt-logo.png`;
    fetch('receipt-logo.png').then(r => r.ok ? r.blob() : null).then(blob => {
      if (!blob) return;
      const reader = new FileReader();
      reader.onload = () => { invoiceLogo = reader.result; };
      reader.readAsDataURL(blob);
    }).catch(() => {});

    // Box sizes read like the till: "Premium — 12 Pieces".
    const BOX_SIZE_NAMES = { s: '12 Pieces', m: '25 Pieces', l: '48 Pieces', mini: 'Mini, 2 Pieces' };
    function receiptItemName(item) {
      const box = /^(premium|luxury)$/i.test(String(item.product_name || '').trim());
      const size = box ? BOX_SIZE_NAMES[String(item.variant_name || '').trim().toLowerCase()] : null;
      return `${item.product_name || ''}${item.variant_name ? ` — ${size || item.variant_name}` : ''}`;
    }

    function invoiceHtml(order) {
      const shopSale = isShopSale(order);
      const pickup = isPickup(order);
      const paid = order.status !== 'cancelled' && isPaid(order);
      const fawranDue = order.payment_method === 'fawran' && !paid;
      const money = v => `${Number(v || 0).toFixed(2)}`;
      const created = new Date(order.created_at);
      const date = created.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Qatar' });
      const time = created.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Qatar' });
      const items = order.order_items || [];
      const rows = items.map(item => {
        const flavours = Array.isArray(item.customization)
          ? item.customization.filter(f => Number(f.quantity) > 0).map(f => `${Number(f.quantity)} ${escapeHtml(f.name)}`).join(', ')
          : '';
        const unit = Number(item.total_price) / Math.max(Number(item.quantity) || 1, 1);
        return `<div class="row">
          <div>${escapeHtml(receiptItemName(item))}${flavours ? ' (Customized)' : ''}${flavours ? `<div class="flavours">${flavours}</div>` : ''}${Number(item.discount_amount) > 0 ? `<div class="flavours">Discount ${escapeHtml(item.discount_label || '')}: − ${money(item.discount_amount)}</div>` : ''}</div>
          <div>${Number(item.quantity)}</div>
          <div>${money(unit)}</div>
          <div>${money(Number(item.total_price) - Number(item.discount_amount || 0))}</div>
        </div>`;
      }).join('');
      // Item discounts show on their lines; the totals show the rest.
      const itemDiscounts = items.reduce((sum, item) => sum + Number(item.discount_amount || 0), 0);
      const discount = Number(order.discount_amount || 0) - itemDiscounts + Number(order.points_discount || 0);
      const discountLabel = [String(order.discount_reason || '').startsWith('Item discounts') ? '' : order.discount_reason, Number(order.points_discount) > 0 ? `${Number(order.points_used)} points` : '']
        .filter(Boolean).join(', ');
      const address = !shopSale && !pickup
        ? [order.delivery_area, ...String(order.delivery_address || '').split('\n')].filter(Boolean).join(', ') : '';
      const title = paid ? 'Receipt' : 'Invoice';
      const total = (label, value) => `<div class="total-row"><span>${label}</span><strong>${value}</strong></div>`;

      return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAVERA ${title.toLowerCase()} ${escapeHtml(order.order_number)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 12mm 15mm; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
