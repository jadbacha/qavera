  .bar { position: sticky; top: 0; z-index: 2; background: #f5edd9; padding: 10px; text-align: center; font-size: 13px; }
  .bar button { font: inherit; padding: 8px 18px; background: #0d0b08; color: #c4a980; border: 0; cursor: pointer; margin-left: 8px; }
  .sheet { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm 15mm; display: flex; flex-direction: column; }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; }
  .order { justify-self: start; font-size: 13px; line-height: 1.45; }
  .order > div:first-child { font-size: 12px; margin-bottom: 2mm; }
  .customer-title { font-weight: bold; font-size: 11px; }
  .logo img { width: 230px; height: auto; display: block; }
  .company { justify-self: end; font-size: 13px; line-height: 1.45; }
  .company strong { display: block; margin-bottom: 1mm; font-size: 11px; }
  hr { width: 100%; height: 2px; margin: 15px 0 20px; padding: 0; border: 0; border-top: 2px solid #C4A980; background: #C4A980; }
  h1 { text-align: center; margin: 3mm 0 4mm; font-size: 30px; font-family: "Cormorant Garamond", serif; font-weight: 500; }
  .head, .row { display: grid; grid-template-columns: 1fr 25mm 35mm 35mm; line-height: 1.3; break-inside: avoid; }
  .head { background: #eeeeee; min-height: 9mm; align-items: center; font-size: 15px; font-weight: bold; }
  .head > div, .row > div { padding: 2mm 0; }
  .head > div:not(:first-child), .row > div:not(:first-child) { text-align: center; }
  .row { min-height: 8mm; border-bottom: 0.25mm solid #eeeeee; align-items: center; font-size: 10.5px; }
  .flavours { margin-top: 3px; font-size: 11px; color: #666; }
  .fawran { margin-top: 6mm; padding: 3mm 4mm; border: 1px solid #C4A980; font-size: 12px; line-height: 1.5; }
  .space { flex: 1 1 auto; }
  .end { break-inside: avoid; }
  .totals { width: 85mm; margin-left: auto; margin-top: 8mm; font-size: 13px; line-height: 1.7; }
  .totals-line, .footer-line { width: 100%; height: 0.3mm; background: #222; margin-bottom: 2mm; }
  .total-row, .grand { display: grid; grid-template-columns: 35mm 1fr; align-items: center; }
  .total-row strong, .grand strong { text-align: right; }
  .grand { border-top: 1px solid #eeeeee; padding-top: 3mm; margin-top: 3mm; font-size: 15px; }
  .footer { margin-top: 3mm; text-align: center; }
  .footer-line { margin-bottom: 3mm; }
  .footer h2 { margin: 0; font-size: 16px; }
  .footer p { margin: 2mm 0 0; font-size: 8px; letter-spacing: 2px; }
  .long .logo img { width: 170px; } .long hr { margin: 8px 0 10px; } .long h1 { margin: 1mm 0 2mm; font-size: 24px; }
  .long .row { min-height: 6mm; } .long .head > div, .long .row > div { padding: 1mm 0; }
  @media print { .bar { display: none; } .sheet { width: auto; min-height: calc(297mm - 24mm - 1mm); padding: 0; } }
  @media screen and (max-width: 820px) { .sheet { width: 100%; padding: 16px; min-height: 0; } .top { grid-template-columns: 1fr; gap: 12px; } .logo { order: -1; } .logo img { width: 150px; margin: 0 auto; } .company { justify-self: start; } .head, .row { grid-template-columns: 1fr 12mm 20mm 20mm; } .totals { width: 100%; } }
</style></head><body>
<div class="bar">Print it, or choose <strong>Save as PDF</strong> in the print window to send it. <button type="button" onclick="window.print()">Print / Save PDF</button></div>
<div class="sheet${items.length > 12 ? ' long' : ''}">
  <div class="top">
    <div class="order">
      <div><strong>Order ${escapeHtml(order.order_number)}</strong></div>
      <div class="customer-title">Customer Information</div>
      <div>Name: ${escapeHtml(order.customer_name || 'Walk-in Customer')}</div>
      <div>Phone: ${escapeHtml(order.customer_phone || '-')}</div>
      ${address ? `<div>Address: ${escapeHtml(address)}</div>` : ''}
      ${!shopSale && scheduleLabel(order) ? `<div>${pickup ? 'Pickup' : 'Delivery'}: ${escapeHtml(scheduleLabel(order))}</div>` : ''}
      ${order.is_gift ? `<div>Gift for: ${escapeHtml(order.gift_recipient_name || '')}${order.gift_recipient_phone ? `, ${escapeHtml(order.gift_recipient_phone)}` : ''}</div>` : ''}
      <div>Date: ${escapeHtml(date)}</div>
      <div>Time: ${escapeHtml(time)}</div>
    </div>
    <div class="logo"><img src="${invoiceLogo}" alt="QAVERA"></div>
    <div class="company">
      <strong>QAVERA TRADING</strong>
      <div>CR: 237335</div>
      <div>Phone: +974 50968968</div>
      <div>info@qavera.qa</div>
      <div>Zone 55, 162, blg 44</div>
    </div>
  </div>

  <hr>
  <h1>${title}</h1>
  <hr>

  <div class="head"><div>Item</div><div>QTY</div><div>Unit Price</div><div>Total</div></div>
  ${rows}

  ${fawranDue ? `<div class="fawran"><strong>Please send ${money(order.total)} QAR by Fawran</strong> to ${escapeHtml(FAWRAN_DETAILS)}, with ${escapeHtml(order.order_number)} in the note. We will prepare your order as soon as we receive it.</div>` : ''}

  <div class="space"></div>

  <div class="end">
    <div class="totals">
      <div class="totals-line"></div>
      ${total('Subtotal', `${money(Number(order.subtotal) - itemDiscounts)} QAR`)}
      ${total('Sale Tax', '0.00 QAR')}
      ${total(`Discount${discountLabel ? ` (${escapeHtml(discountLabel)})` : ''}`, `${discount > 0 ? `− ${money(discount)}` : '0.00'} QAR`)}
      ${!shopSale && !pickup ? total('Delivery', `${money(order.delivery_fee)} QAR`) : ''}
      ${total('Payment Method', escapeHtml(paidBy(order)))}
      ${total('Status', order.status === 'cancelled' ? 'Cancelled' : paid ? 'Paid' : 'Not paid yet')}
      <div class="grand"><span>TOTAL</span><strong>${money(order.total)} QAR</strong></div>
    </div>
    <div class="footer">
      <div class="footer-line"></div>
      <h2>${paid && shopSale ? 'Thank you for your purchase!' : 'Thank you for your order!'}</h2>
      <p>W E &nbsp; A P P R E C I A T E &nbsp; Y O U R &nbsp; S U P P O R T</p>
    </div>
  </div>
</div>
<script>
  // Open the print window once the logo and font are ready.
  const img = document.querySelector('.logo img');
  const go = () => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => window.print(), 300));
  if (img.complete) go(); else { img.onload = go; img.onerror = go; }
<\/script>
</body></html>`;
    }

    function openInvoice(order) {
      const win = window.open('', '_blank');
      if (!win) {
        alert('Please allow pop-ups for this page to open the invoice.');
        return;
      }
      win.document.open();
      win.document.write(invoiceHtml(order));
      win.document.close();
    }

    // Edit (not shop sales) and delete (any order; second tap to confirm).
    function renderEditDelete(order) {
      const edit = !isShopSale(order) && order.status !== 'cancelled'
        ? `<button type="button" class="invoice-btn" data-edit="${order.id}">✏️ Edit order</button>` : '';
      return `${edit}<button type="button" class="invoice-btn delete-btn" data-delete="${order.id}">🗑 Delete order</button>`;
    }

    // Change how an order is paid (e.g. said cash, then paid by Fawran).
    function renderPaymentChange(order) {
      if (isShopSale(order) || order.status === 'cancelled') return '';
      const opt = (value, label) => `<option value="${value}" ${order.payment_method === value ? 'selected' : ''}>${label}</option>`;
      return `<button type="button" class="invoice-btn" data-paychange="${order.id}">💳 Change payment</button>
        <div class="pay-change" id="pay-${order.id}" hidden>
          <select aria-label="Payment method">
            ${opt('cash_on_delivery', isPickup(order) ? 'Cash on pickup' : 'Cash on delivery')}
            ${opt('card_on_delivery', isPickup(order) ? 'Card on pickup' : 'Card on delivery')}
            ${opt('fawran', 'Fawran')}
            ${order.payment_method === 'card_online' ? opt('card_online', 'Card (paid online)') : ''}
          </select>
          <label><input type="checkbox" ${order.payment_status === 'paid' ? 'checked' : ''}> Already paid</label>
          <button type="button" class="action primary" data-paysave="${order.id}">Save</button>
        </div>`;
    }

    function renderActions(order) {
      if (isShopSale(order) && order.status === 'delivered') {
        return `<div class="actions"><span class="final-note">Paid in the shop</span><div class="wa-row"><button type="button" class="invoice-btn" data-invoice="${order.id}">🧾 Print receipt</button>${renderEditDelete(order)}</div><div class="order-message" id="msg-${order.id}"></div></div>`;
      }
      const fawranButton = cardUnpaid(order)
        ? `<button type="button" class="action primary" data-cardcheck="${order.id}">🔄 Check card payment</button>`
        : order.payment_method !== 'fawran' ? ''
        : order.payment_status === 'paid'
        ? `<button type="button" class="action paid-button" data-paid="${order.id}" data-value="false">Fawran received ✓ (undo)</button>`
        : `<button type="button" class="action primary" data-paid="${order.id}" data-value="true">Fawran received</button>`;
      if (order.status === 'delivered') {
        return `<div class="actions">${order.payment_status === 'paid' ? '' : fawranButton}<span class="final-note">${isPickup(order) ? 'Collected' : 'Delivered'}${Number(order.points_earned) > 0 ? ` · ${Number(order.points_earned)} points given` : ''}</span>${renderWhatsApp(order)}<div class="wa-row">${renderPaymentChange(order)}${renderEditDelete(order)}</div><div class="order-message" id="msg-${order.id}"></div></div>`;
      }
      if (order.status === 'cancelled') {
        return `<div class="actions"><span class="final-note">Cancelled${Number(order.points_used) > 0 ? ' · points returned to the customer' : ''}</span><div class="wa-row">${renderEditDelete(order)}</div><div class="order-message" id="msg-${order.id}"></div></div>`;
      }

      const index = FLOW.indexOf(order.status);
      const next = FLOW[index + 1];
      const buttons = fawranButton ? [fawranButton] : [];

      if (next) {
        buttons.push(`<button type="button" class="action primary" data-id="${order.id}" data-status="${next}">${actionLabel(order, next)}</button>`);
      }
      if (next !== 'delivered') {
        buttons.push(`<button type="button" class="action" data-id="${order.id}" data-status="delivered">${actionLabel(order, 'delivered')}</button>`);
      }
      buttons.push(`<button type="button" class="action danger" data-id="${order.id}" data-status="cancelled">Cancel order</button>`);

      return `<div class="actions">${buttons.join('')}${renderWhatsApp(order)}<div class="wa-row">${renderPaymentChange(order)}${renderEditDelete(order)}</div><div class="order-message" id="msg-${order.id}"></div></div>`;
    }

    function renderOrder(order) {
      const digits = String(order.customer_phone || '').replace(/\D/g, '');

      const items = (order.order_items || []).map(item => {
        const flavors = Array.isArray(item.customization)
          ? item.customization.filter(f => Number(f.quantity) > 0)
              .map(f => `<span class="flavor-row"><span>${escapeHtml(f.name)}</span><strong>${Number(f.quantity)}</strong></span>`).join('')
          : '';
        return `<li>
          <span>${escapeHtml(item.product_name)} — ${escapeHtml(item.variant_name)} × ${Number(item.quantity)}
            ${flavors ? `<span class="custom-box"><span class="custom-label">Customized · per box</span>${flavors}</span>` : ''}
            ${Number(item.discount_amount) > 0 ? `<span class="item-disc">${escapeHtml(item.discount_label || 'Discount')}: − ${qar(item.discount_amount)}</span>` : ''}</span>
          <span>${qar(Number(item.total_price) - Number(item.discount_amount || 0))}</span>
        </li>`;
      }).join('');

      return `
        <article class="order ${order.status === 'pending' ? 'is-new' : ''}">
          <div class="order-top">
            <div>
              <div class="order-number">${escapeHtml(order.order_number)}</div>
              <div class="order-time">${escapeHtml(formatTime(order.created_at))}</div>
              ${scheduleLabel(order) ? `<div class="order-when ${isPickup(order) ? 'is-pickup' : ''}">${isPickup(order) ? 'Pickup' : 'Delivery'} · ${escapeHtml(scheduleLabel(order))}</div>` : ''}${order.is_gift ? '<span class="gift-tag">🎁 Gift</span>' : ''}${order.payment_method === 'fawran' ? `<span class="pay-tag ${order.payment_status === 'paid' ? 'paid' : ''}">${order.payment_status === 'paid' ? 'Fawran received' : 'Waiting for Fawran'}</span>` : ''}${order.payment_method === 'card_online' ? `<span class="pay-tag ${order.payment_status === 'paid' ? 'paid' : ''}">${order.payment_status === 'paid' ? 'Paid online by card' : 'Card payment not completed'}</span>` : ''}
            </div>
            <span class="status ${escapeHtml(order.status)}">${isShopSale(order) && order.status === 'delivered' ? 'Shop sale' : escapeHtml(statusLabel(order))}</span>
          </div>

          <div class="order-grid">
            <div>
              <div class="block-label">${order.is_gift ? 'Customer (paying)' : 'Customer'}</div>
              <div class="block">
                ${escapeHtml(order.customer_name)}
                ${digits ? `<br><a href="tel:+${digits}">${escapeHtml(order.customer_phone)}</a>` : ''}
                ${order.customer_email ? `<br><span class="muted">${escapeHtml(order.customer_email)}</span>` : ''}
                ${order.source === 'whatsapp' ? `<br><span class="muted">Ordered on WhatsApp / phone</span>` : ''}
                ${digits ? `<div class="contact-links">
                  <a href="https://wa.me/${waDigits(digits)}" target="_blank" rel="noopener">WhatsApp</a>
                  <a href="tel:+${digits}">Call</a>
                </div>` : ''}
              </div>

              ${order.is_gift ? (() => {
                const giftDigits = String(order.gift_recipient_phone || '').replace(/\D/g, '');
                return `<div class="block-label" style="margin-top:16px;">🎁 Gift for</div>
              <div class="block">
                ${escapeHtml(order.gift_recipient_name)}
                ${giftDigits ? `<br><a href="tel:+${giftDigits}">${escapeHtml(order.gift_recipient_phone)}</a>
                <div class="contact-links"><a href="https://wa.me/${waDigits(giftDigits)}" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+${giftDigits}">Call</a></div>` : ''}
                ${order.gift_message ? `<div class="gift-card">“${escapeHtml(order.gift_message)}”</div>` : ''}
              </div>`;
              })() : ''}
              ${isShopSale(order) ? `<div class="block-label" style="margin-top:16px;">Sold in</div>
              <div class="block">The QAVERA shop</div>` : isPickup(order) ? `<div class="block-label" style="margin-top:16px;">Pickup</div>
              <div class="block">Customer collects from the shop</div>` : `<div class="block-label" style="margin-top:16px;">Deliver to</div>
              <div class="block address">${escapeHtml(order.delivery_area)}
${escapeHtml(order.delivery_address)}</div>`}
              ${order.notes ? `<div class="block muted" style="margin-top:6px;">Notes: ${escapeHtml(order.notes)}</div>` : ''}
            </div>

            <div>
              <div class="block-label">Items</div>
              <ul class="items">${items}</ul>
              <div class="totals">
                <div><span>Subtotal</span><span>${qar(order.subtotal)}</span></div>
                ${Number(order.points_discount) > 0 ? `<div><span>Points (${Number(order.points_used)})</span><span>− ${qar(order.points_discount)}</span></div>` : ''}
                ${Number(order.discount_amount) > 0 ? `<div><span>${isShopSale(order) ? 'Shop discount' : 'Discount'}${order.discount_reason ? ` · ${escapeHtml(order.discount_reason)}` : ''}</span><span>− ${qar(order.discount_amount)}</span></div>` : ''}
                ${isShopSale(order) ? '' : isPickup(order) ? `<div><span>Pickup</span><span>Free</span></div>` : `<div><span>Delivery</span><span>${qar(order.delivery_fee)}</span></div>`}
                <div class="grand"><span>Total · ${escapeHtml(isPickup(order) ? String(PAYMENT_LABELS[order.payment_method] || order.payment_method).replace('delivery', 'pickup') : (PAYMENT_LABELS[order.payment_method] || order.payment_method))}</span><span>${qar(order.total)}</span></div>
              </div>
            </div>
          </div>

          ${renderActions(order)}
        </article>`;
    }

    function renderStock() {
      if (!products) {
        content.innerHTML = `<div class="notice"><h2>Stock is not set up yet</h2><p>Run <strong>015_out_of_stock.sql</strong> in Supabase, then refresh this page.</p></div>`;
        return;
      }
      const groups = STOCK_GROUPS.map(group => {
        const list = products.filter(group.match);
        if (!list.length) return '';
        return `<section class="stock-group">
          <div class="block-label">${group.label}</div>
          ${list.map(p => `<div class="stock-row ${p.in_stock === false ? 'is-out' : ''}">
            <span class="stock-name">${escapeHtml(p.name)}</span>
            <span class="stock-state">${p.in_stock === false ? 'Sold out' : 'In stock'}</span>
            <button type="button" class="action ${p.in_stock === false ? 'primary' : ''} stock-toggle" data-product="${p.id}" data-in-stock="${p.in_stock === false ? 'true' : 'false'}">
              ${p.in_stock === false ? 'Back in stock' : 'Mark sold out'}
            </button>
          </div>`).join('')}
        </section>`;
      }).join('');
      content.innerHTML = `<p class="stock-intro">Sold-out products stay on the website with a "Sold out" label and can't be ordered. The shop till shows them greyed out.</p>
        <div class="stock-message" id="stockMessage" role="alert"></div>${groups}`;
    }

    async function setStock(button) {
      const message = document.getElementById('stockMessage');
      button.disabled = true;
      if (message) message.textContent = '';
      const { error } = await adminSupabase.rpc('admin_set_product_stock', {
        p_product_id: button.dataset.product,
        p_in_stock: button.dataset.inStock === 'true'
      });
      if (error) {
        console.error('Could not change stock:', error);
        if (message) message.textContent = error.message || 'Could not change stock.';
        button.disabled = false;
        return;
      }
      await loadOrders();
    }

    function renderDayBar() {
      const bar = document.getElementById('dayBar');
      bar.hidden = ['stock', 'new', 'areas', 'sales'].includes(activeFilter);
      document.getElementById('dayFrom').value = dayFrom;
      document.getElementById('dayTo').value = dayTo;
      bar.querySelectorAll('[data-day]').forEach(b => {
        const target = b.dataset.day === 'today' ? qatarDayOffset(0) : b.dataset.day === 'tomorrow' ? qatarDayOffset(1) : '';
        b.classList.toggle('active', dayFrom === target && dayTo === target);
      });
      const filter = FILTERS.find(f => f.key === activeFilter);
      document.getElementById('printTitle').textContent =
        `QAVERA · ${filter ? filter.label : ''} · ${rangeLabel()}`;
    }

    function render() {
      renderFilters();
      renderDayBar();
      if (activeFilter === 'stock') {
        renderStock();
        return;
      }
      if (activeFilter === 'sales') {
        if (!document.getElementById('salesPanel')) renderSales();
        return;
      }
      if (activeFilter === 'areas') {
        if (!document.getElementById('areasPanel')) renderAreas();
        return;
      }
      if (activeFilter === 'dayclose') {
        if (!document.getElementById('dayClosePanel')) renderDayClose();
        return;
      }
      if (activeFilter === 'new') {
        // Keep what has been typed when the list refreshes in the background.
        if (!document.getElementById('newOrderForm')) renderNewOrder();
        return;
      }
      const filter = FILTERS.find(f => f.key === activeFilter);
      const visible = orders.filter(o => dayMatch(o) && filter.match(o));
      // To do: soonest delivery / pickup first.
      if (activeFilter === 'active') {
        visible.sort((a, b) => String(a.scheduled_date || '9999') .localeCompare(String(b.scheduled_date || '9999'))
          || String(a.time_slot || '').localeCompare(String(b.time_slot || '')));
      }

      if (!visible.length) {
        content.innerHTML = `<div class="notice"><h2>Nothing here</h2><p>${(dayFrom || dayTo) ? `No orders in this list for ${escapeHtml(rangeLabel())}.` : activeFilter === 'active' ? 'No orders waiting. New orders will appear here.' : 'No orders in this list yet.'}</p></div>`;
        return;
      }

      content.innerHTML = `<div class="order-list">${visible.map(renderOrder).join('')}</div>`;
    }

    // ---- Sales: every order with when, how much and how it was paid ----
    let salesOrders = null;
    let salesFrom = '';
    let salesTo = '';
    let salesShowCancelled = false;

    async function loadSalesOrders() {
      // All orders (not only the latest 300), in pages of 1000.
      const all = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await adminSupabase
          .from('orders')
          .select('order_number, created_at, source, customer_name, customer_phone, subtotal, discount_amount, points_discount, delivery_fee, total, payment_method, payment_status, status, fulfillment_type')
          .order('created_at', { ascending: false })
          .range(from, from + 999);
        if (error) throw error;
        all.push(...(data || []));
        if (!data || data.length < 1000) break;
      }
      return all;
    }

    const SOURCE_LABELS = { website: 'Website', whatsapp: 'WhatsApp / phone', store: 'Shop (till)' };
    function paidBy(o) {
      const pickup = o.fulfillment_type === 'pickup';
      return ({
        cash_on_delivery: pickup ? 'Cash on pickup' : 'Cash on delivery',
        card_on_delivery: pickup ? 'Card on pickup' : 'Card on delivery',
        fawran: 'Fawran', card_online: 'Card online', cash: 'Cash in shop', card: 'Card in shop'
      })[o.payment_method] || o.payment_method || '';
    }
    function paymentState(o) {
      if (o.status === 'cancelled') return 'Cancelled';
      if (o.payment_status === 'paid' || o.source === 'store') return 'Paid';
      if (o.status === 'delivered') return 'Paid on delivery / pickup';
      return 'Not paid yet';
    }
    const isPaid = o => ['Paid', 'Paid on delivery / pickup'].includes(paymentState(o));
    const madeAt = o => new Date(o.created_at).toLocaleString('en-GB', {
      timeZone: 'Asia/Qatar', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    function salesInRange() {
      return (salesOrders || []).filter(o => {
        const day = qatarDay(o.created_at);
        // Unpaid card online orders are checkouts the customer never paid: not sales.
        return (!salesFrom || day >= salesFrom) && (!salesTo || day <= salesTo)
          && (salesShowCancelled || o.status !== 'cancelled') && !cardUnpaid(o);
      });
    }

    async function renderSales() {
      content.innerHTML = '<div class="notice"><p>Loading sales…</p></div>';
      try {
        salesOrders = await loadSalesOrders();
      } catch (error) {
        content.innerHTML = `<div class="notice"><h2>Could not load sales</h2><p>${escapeHtml(error.message)}</p></div>`;
        return;
      }
      if (activeFilter === 'sales') drawSales();
    }

    function drawSales() {
      const list = salesInRange();
      const counted = list.filter(o => o.status !== 'cancelled');
      const sum = arr => arr.reduce((t, o) => t + Number(o.total || 0), 0);
      const byMethod = {};
      counted.forEach(o => { const k = paidBy(o); byMethod[k] = (byMethod[k] || 0) + Number(o.total || 0); });
      const bySource = {};
      counted.forEach(o => { const k = SOURCE_LABELS[o.source] || o.source; bySource[k] = (bySource[k] || 0) + Number(o.total || 0); });
      const paidTotal = sum(counted.filter(isPaid));
      const unpaidTotal = sum(counted.filter(o => !isPaid(o)));
      const presets = [
        ['today', 'Today'], ['week', 'Last 7 days'], ['month', 'This month'], ['all', 'All time']
      ];
      const activePreset = presetFor(salesFrom, salesTo);
      const rangeText = !salesFrom && !salesTo ? 'All time'
        : salesFrom === salesTo ? dayLabel(salesFrom) : `${salesFrom ? dayLabel(salesFrom) : 'Start'} to ${salesTo ? dayLabel(salesTo) : 'today'}`;

      content.innerHTML = `
        <div id="salesPanel">
          <div class="sales-bar">
            ${presets.map(([k, l]) => `<button type="button" class="filter ${activePreset === k ? 'active' : ''}" data-sales-preset="${k}">${l}</button>`).join('')}
            <label>From <input type="date" id="salesFrom" value="${salesFrom}"></label>
            <label>To <input type="date" id="salesTo" value="${salesTo}"></label>
            <label class="sales-check"><input type="checkbox" id="salesCancelled" ${salesShowCancelled ? 'checked' : ''}> Show cancelled</label>
          </div>

          <h2 class="sales-range">${escapeHtml(rangeText)}</h2>
          <div class="sales-cards">
            <div class="sales-card big"><span>Total sales</span><strong>${qar(sum(counted))}</strong><em>${counted.length} order${counted.length === 1 ? '' : 's'}</em></div>
            <div class="sales-card"><span>Paid</span><strong>${qar(paidTotal)}</strong></div>
            <div class="sales-card"><span>Not paid yet</span><strong>${qar(unpaidTotal)}</strong></div>
            ${Object.entries(bySource).map(([k, v]) => `<div class="sales-card"><span>${escapeHtml(k)}</span><strong>${qar(v)}</strong></div>`).join('')}
          </div>
          <div class="sales-methods">${Object.entries(byMethod).map(([k, v]) => `<span>${escapeHtml(k)}: <b>${qar(v)}</b></span>`).join('')}</div>

          <div class="sales-actions">
            <button type="button" class="action" data-sales-csv>Download for Excel (CSV)</button>
            <button type="button" class="action" data-sales-print>Print</button>
          </div>

          ${list.length ? `<div class="sales-table-wrap"><table class="sales-table">
            <thead><tr><th>Order</th><th>Made</th><th>Source</th><th>Customer</th><th class="r">Amount</th><th>Paid by</th><th>Payment</th></tr></thead>
            <tbody>${list.map(o => `<tr class="${o.status === 'cancelled' ? 'is-cancelled' : ''}">
              <td>${escapeHtml(o.order_number)}</td>
              <td>${escapeHtml(madeAt(o))}</td>
              <td>${escapeHtml(SOURCE_LABELS[o.source] || o.source || '')}</td>
              <td>${escapeHtml(o.customer_name || '')}</td>
              <td class="r">${qar(o.total)}</td>
              <td>${escapeHtml(paidBy(o))}</td>
              <td><span class="pay-state ${isPaid(o) ? 'paid' : o.status === 'cancelled' ? 'cancelled' : 'unpaid'}">${escapeHtml(paymentState(o))}</span></td>
            </tr>`).join('')}</tbody>
            <tfoot><tr><td colspan="4">Total (without cancelled)</td><td class="r">${qar(sum(counted))}</td><td colspan="2"></td></tr></tfoot>
          </table></div>` : '<div class="notice"><p>No orders in this period.</p></div>'}
        </div>`;

      document.getElementById('salesFrom').addEventListener('change', e => { salesFrom = e.target.value; if (salesTo && salesFrom > salesTo) salesTo = salesFrom; drawSales(); });
      document.getElementById('salesTo').addEventListener('change', e => { salesTo = e.target.value; if (salesFrom && salesTo < salesFrom) salesFrom = salesTo; drawSales(); });
      document.getElementById('salesCancelled').addEventListener('change', e => { salesShowCancelled = e.target.checked; drawSales(); });
    }

    function presetDates(key) {
      const today = qatarDayOffset(0);
      if (key === 'today') return [today, today];
      if (key === 'week') return [qatarDayOffset(-6), today];
      if (key === 'month') return [today.slice(0, 8) + '01', today];
      return ['', ''];
    }
    const presetFor = (from, to) => ['today', 'week', 'month', 'all'].find(k => {
      const [f, t] = presetDates(k);
      return f === from && t === to;
    }) || '';

    function salesClick(event) {
      const preset = event.target.closest('[data-sales-preset]');
      if (preset) {
        [salesFrom, salesTo] = presetDates(preset.dataset.salesPreset);
        drawSales();
        return;
      }
      if (event.target.closest('[data-sales-print]')) { window.print(); return; }
      if (event.target.closest('[data-sales-csv]')) downloadSalesCsv();
    }

    // How an order was sold and paid, for the report.
    const saleType = o => o.source === 'store' ? 'In shop' : o.fulfillment_type === 'pickup' ? 'Pickup' : 'Delivery';
    const payGroup = o => ({ cash_on_delivery: 'Cash', cash: 'Cash', card_on_delivery: 'Card', card: 'Card', card_online: 'Card', fawran: 'Fawran' })[o.payment_method] || 'Other';
    const fullDay = day => new Date(`${day}T12:00:00Z`).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'
    });

    function downloadSalesCsv() {
      const list = salesInRange();
      const counted = list.filter(o => o.status !== 'cancelled');
      const money = v => Math.round(Number(v || 0) * 100) / 100;
      const sum = (arr, key = 'total') => money(arr.reduce((t, o) => t + Number(o[key] || 0), 0));
      const count = arr => `${arr.length} order${arr.length === 1 ? '' : 's'}`;

      // All time starts at the first order.
      const firstDay = (salesOrders || []).reduce((min, o) => { const d = qatarDay(o.created_at); return !min || d < min ? d : min; }, '');
      const from = salesFrom || firstDay || qatarDayOffset(0);
      const to = salesTo || qatarDayOffset(0);
      const title = from === to ? `QAVERA sales on ${fullDay(from)}` : `QAVERA sales from ${fullDay(from)} to ${fullDay(to)}`;

      const methods = ['Cash', 'Card', 'Fawran'];
      if (counted.some(o => payGroup(o) === 'Other')) methods.push('Other');
      const types = ['Delivery', 'Pickup', 'In shop'];
      const totalFor = (type, method) => sum(counted.filter(o => (!type || saleType(o) === type) && (!method || payGroup(o) === method)));

      const rows = [
        [title],
        [`Downloaded ${madeAt({ created_at: new Date().toISOString() })} (Qatar time). Amounts in QAR. Cancelled orders are not counted in the totals.`],
        [],
        ['SUMMARY'],
        ['Total sales', sum(counted), count(counted)],
        ['Paid', sum(counted.filter(isPaid)), count(counted.filter(isPaid))],
        ['Not paid yet', sum(counted.filter(o => !isPaid(o))), count(counted.filter(o => !isPaid(o)))],
        ['Products (before discounts)', sum(counted, 'subtotal')],
        ['Discounts given', money(-(sum(counted, 'discount_amount') + sum(counted, 'points_discount')))],
        ['Delivery charges', sum(counted, 'delivery_fee')],
        [],
        ['BY PAYMENT'],
        ...methods.map(m => { const arr = counted.filter(o => payGroup(o) === m); return [m, sum(arr), count(arr)]; }),
        [],
        ['BY TYPE'],
        ...types.map(t => { const arr = counted.filter(o => saleType(o) === t); return [t, sum(arr), count(arr)]; }),
        [],
        ['BY TYPE AND PAYMENT', ...methods, 'Total'],
        ...types.map(t => [t, ...methods.map(m => totalFor(t, m)), totalFor(t, null)]),
        ['Total', ...methods.map(m => totalFor(null, m)), totalFor(null, null)],
        [],
        ['BY WHERE THE ORDER CAME FROM'],
        ...Object.entries(SOURCE_LABELS).map(([k, label]) => { const arr = counted.filter(o => o.source === k); return [label, sum(arr), count(arr)]; }),
        [],
        ['ALL ORDERS'],
        ['Order', 'Made (Qatar time)', 'Type', 'Came from', 'Customer', 'Phone', 'Products', 'Discount', 'Delivery', 'Total', 'Paid by', 'Payment', 'Status'],
        ...list.map(o => [o.order_number, madeAt(o), saleType(o), SOURCE_LABELS[o.source] || o.source, o.customer_name, o.customer_phone,
          money(o.subtotal), money(-(Number(o.discount_amount || 0) + Number(o.points_discount || 0))), money(o.delivery_fee), money(o.total),
          paidBy(o), paymentState(o), statusLabel(o)]),
        ['Total (without cancelled)', '', '', '', '', '', sum(counted, 'subtotal'),
          money(-(sum(counted, 'discount_amount') + sum(counted, 'points_discount'))), sum(counted, 'delivery_fee'), sum(counted)]
      ];

      const cell = v => typeof v === 'number' ? String(v) : `"${String(v ?? '').replace(/"/g, '""')}"`;
      const blob = new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `QAVERA sales ${from} to ${to}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }

    // ---- Day close: the same daily report as the till (cash out and closing are done in the till) ----
    let closeDay = qatarDayOffset(0);
    let closeMode = 'day';  // 'day' | 'month'
    let closeMonth = qatarDayOffset(0).slice(0, 7);
    const closeSwitch = () => `<div class="sales-bar">
      <button type="button" class="filter ${closeMode === 'day' ? 'active' : ''}" data-close-mode="day">Day</button>
      <button type="button" class="filter ${closeMode === 'month' ? 'active' : ''}" data-close-mode="month">Month</button></div>`;
    function bindCloseSwitch() {
      content.querySelectorAll('[data-close-mode]').forEach(b => b.addEventListener('click', () => { closeMode = b.dataset.closeMode; renderDayClose(); }));
    }
    // Cash in and cash out together, in order.
    const moves = r => [...(r.cash_in || []).map(o => ({ ...o, kind: 'in' })), ...(r.cash_out || []).map(o => ({ ...o, kind: 'out' }))]
      .sort((a, b) => String(a.day || '').localeCompare(String(b.day || '')) || new Date(a.created_at) - new Date(b.created_at));
    const signedQar = d => d === null || d === undefined ? '–' : Number(d) === 0 ? 'Exact' : Number(d) > 0 ? `+ ${qar(d)}` : `− ${qar(-d)}`;
    const diffCls = d => d === null || d === undefined ? '' : Number(d) === 0 ? 'dc-ok' : Number(d) > 0 ? 'dc-over' : 'dc-minus';

    async function renderMonthClose() {
      content.innerHTML = '<div class="notice"><p>Loading the month close…</p></div>';
      const { data: r, error } = await adminSupabase.rpc('month_report', { p_month: `${closeMonth}-01` });
      if (activeFilter !== 'dayclose' || closeMode !== 'month') return;
      if (error) {
        content.innerHTML = `${closeSwitch()}<div class="notice"><h2>Could not load the month close</h2><p>${escapeHtml(/month_report/.test(error.message || '') ? 'Run 041_month_close.sql in Supabase first.' : error.message)}</p></div>`;
        bindCloseSwitch();
        return;
      }
      const line = key => r.lines?.[key] || { count: 0, total: 0 };
      const monthLabel = new Date(`${closeMonth}-15T12:00:00Z`).toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      const shortDay = d => new Date(`${d}T12:00:00Z`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      content.innerHTML = `
        <div id="dayClosePanel" class="dayclose">
          ${closeSwitch()}
          <div class="sales-bar">
            <button type="button" class="filter" data-month-shift="-1">‹ Previous month</button>
            <label>Month <input type="month" id="closeMonth" value="${closeMonth}" max="${qatarDayOffset(0).slice(0, 7)}"></label>
            <button type="button" class="filter" data-month-shift="1" ${closeMonth >= qatarDayOffset(0).slice(0, 7) ? 'disabled' : ''}>Next month ›</button>
          </div>
          <h2 class="sales-range">${escapeHtml(monthLabel)}</h2>
          <div class="sales-cards">
            <div class="sales-card big"><span>Total sales</span><strong>${qar(r.total_sales)}</strong></div>
            <div class="sales-card"><span>Cash sales (into drawer)</span><strong>${qar(r.drawer_cash_in)}</strong></div>
            <div class="sales-card"><span>Cash in / out</span><strong><span class="dc-ok">+ ${qar(r.cash_in_total || 0)}</span> <span class="dc-minus">− ${qar(r.cash_out_total)}</span></strong></div>
            <div class="sales-card"><span>Difference · ${Number(r.days_closed)} day${Number(r.days_closed) === 1 ? '' : 's'} closed</span><strong class="${diffCls(r.difference_total)}">${signedQar(r.difference_total)}</strong></div>
          </div>
          <div class="dc-grid">
            <div class="dc-card">
              <h3>Sales by payment</h3>
              <table class="sales-table"><tbody>
                ${CLOSE_LINES.map(([key, label, note]) => `<tr class="${line(key).count ? '' : 'dc-zero'}"><td>${label}${note ? `<div class="dc-note">${note}</div>` : ''}</td><td class="r">${line(key).count}</td><td class="r">${qar(line(key).total)}</td></tr>`).join('')}
              </tbody><tfoot><tr><td>Total sales</td><td></td><td class="r">${qar(r.total_sales)}</td></tr></tfoot></table>
            </div>
            <div class="dc-card">
              <h3>Cash in &amp; out</h3>
              ${moves(r).length ? `<ul class="dc-out">${moves(r).map(o => `<li><b class="${o.kind === 'in' ? 'dc-ok' : ''}">${o.kind === 'in' ? '+' : '−'} ${qar(o.amount)}</b> ${escapeHtml(o.reason)}<span>${escapeHtml(shortDay(o.day))}${o.by ? ` · ${escapeHtml(o.by)}` : ''}</span></li>`).join('')}</ul>` : '<p class="dc-note">No cash added or taken out.</p>'}
            </div>
          </div>
          <div class="dc-card" style="margin-top:18px;">
            <h3>Day by day</h3>
            ${(r.days || []).length ? `<div class="sales-table-wrap"><table class="sales-table">
              <thead><tr><th>Day</th><th class="r">Sales</th><th class="r">Cash sales</th><th class="r">Cash in</th><th class="r">Cash out</th><th class="r">Expected</th><th class="r">Counted</th><th class="r">Difference</th></tr></thead>
              <tbody>${r.days.map(d => `<tr class="dc-day" data-open-day="${d.day}"><td>${escapeHtml(shortDay(d.day))}${d.closed ? '' : '<div class="dc-note">not closed</div>'}</td>
                <td class="r">${qar(d.total_sales)}</td><td class="r">${qar(d.drawer_cash_in)}</td>
                <td class="r">${Number(d.cash_in) ? `<span class="dc-ok">+ ${qar(d.cash_in)}</span>` : '–'}</td>
                <td class="r">${Number(d.cash_out) ? `<span class="dc-minus">− ${qar(d.cash_out)}</span>` : '–'}</td>
                <td class="r">${d.closed ? qar(d.expected_cash) : '–'}</td><td class="r">${d.closed ? qar(d.counted_cash) : '–'}</td>
                <td class="r ${d.closed ? diffCls(d.difference) : ''}">${d.closed ? signedQar(d.difference) : '–'}</td></tr>`).join('')}</tbody>
              <tfoot><tr><td>Month</td><td class="r">${qar(r.total_sales)}</td><td class="r">${qar(r.drawer_cash_in)}</td><td class="r">+ ${qar(r.cash_in_total || 0)}</td><td class="r">− ${qar(r.cash_out_total)}</td><td></td><td></td><td class="r ${diffCls(r.difference_total)}">${signedQar(r.difference_total)}</td></tr></tfoot>
            </table></div>` : '<p class="dc-note">Nothing this month yet.</p>'}
          </div>
        </div>`;
      bindCloseSwitch();
      document.getElementById('closeMonth').addEventListener('change', e => { closeMonth = e.target.value || qatarDayOffset(0).slice(0, 7); renderMonthClose(); });
      content.querySelectorAll('[data-month-shift]').forEach(b => b.addEventListener('click', () => {
        const d = new Date(`${closeMonth}-15T12:00:00Z`);
        d.setUTCMonth(d.getUTCMonth() + Number(b.dataset.monthShift));
        const next = d.toISOString().slice(0, 7);
        if (next <= qatarDayOffset(0).slice(0, 7)) { closeMonth = next; renderMonthClose(); }
      }));
      content.querySelectorAll('[data-open-day]').forEach(row => row.addEventListener('click', () => {
        closeDay = row.dataset.openDay; closeMode = 'day'; renderDayClose();
      }));
    }
    const CLOSE_LINES = [
      ['shop_cash', 'Shop · cash'], ['shop_card', 'Shop · card'],
      ['cash_on_pickup', 'Website · cash on pickup'], ['card_on_pickup', 'Website · card on pickup'],
      ['cash_on_delivery', 'Website · cash on delivery', 'with the delivery company'], ['card_on_delivery', 'Website · card on delivery'],
      ['fawran', 'Website · Fawran'], ['card_online', 'Website · card online']
    ];
    async function renderDayClose() {
      if (closeMode === 'month') { renderMonthClose(); return; }
      content.innerHTML = '<div class="notice"><p>Loading the day close…</p></div>';
      const { data: r, error } = await adminSupabase.rpc('day_report', { p_day: closeDay });
      if (activeFilter !== 'dayclose' || closeMode !== 'day') return;
      if (error) {
        content.innerHTML = `<div class="notice"><h2>Could not load the day close</h2><p>${escapeHtml(/day_report/.test(error.message || '') ? 'Run 040_day_close.sql in Supabase first.' : error.message)}</p></div>`;
        return;
      }
      const line = key => r.lines?.[key] || { count: 0, total: 0 };
      const c = r.closing;
      const diff = c ? Number(c.difference) : null;
      const diffText = diff === null ? 'Not closed yet' : diff === 0 ? 'Exact' : diff > 0 ? `+ ${qar(diff)} over` : `− ${qar(-diff)} short`;
      content.innerHTML = `
        <div id="dayClosePanel" class="dayclose">
          ${closeSwitch()}
          <div class="sales-bar">
            <button type="button" class="filter" data-close-shift="-1">‹ Previous day</button>
            <label>Day <input type="date" id="closeDay" value="${closeDay}" max="${qatarDayOffset(0)}"></label>
            <button type="button" class="filter" data-close-shift="1" ${closeDay >= qatarDayOffset(0) ? 'disabled' : ''}>Next day ›</button>
          </div>
          <h2 class="sales-range">${escapeHtml(dayLabel(closeDay))}</h2>
          <div class="dc-grid">
            <div class="dc-card">
              <h3>Sales</h3>
              <table class="sales-table"><tbody>
                ${CLOSE_LINES.map(([key, label, note]) => `<tr class="${line(key).count ? '' : 'dc-zero'}"><td>${label}${note ? `<div class="dc-note">${note}</div>` : ''}</td><td class="r">${line(key).count}</td><td class="r">${qar(line(key).total)}</td></tr>`).join('')}
              </tbody><tfoot><tr><td>Total sales</td><td></td><td class="r">${qar(r.total_sales)}</td></tr></tfoot></table>
              <p class="dc-note">Website orders count on the day the money comes in.</p>
            </div>
            <div class="dc-card">
              <h3>Cash in &amp; out</h3>
              ${moves(r).length ? `<ul class="dc-out">${moves(r).map(o => `<li><b class="${o.kind === 'in' ? 'dc-ok' : ''}">${o.kind === 'in' ? '+' : '−'} ${qar(o.amount)}</b> ${escapeHtml(o.reason)}<span>${new Date(o.created_at).toLocaleTimeString('en-GB', { timeZone: 'Asia/Qatar', hour: '2-digit', minute: '2-digit' })}${o.by ? ` · ${escapeHtml(o.by)}` : ''}</span></li>`).join('')}</ul>` : '<p class="dc-note">No cash added or taken out.</p>'}
              <h3 style="margin-top:18px;">Cash drawer</h3>
              <div class="dc-row"><span>Opening cash</span><span>${qar(c ? c.opening_cash : r.opening_cash)}</span></div>
              <div class="dc-row"><span>+ Cash sales (shop cash + cash on pickup)</span><span>${qar(r.drawer_cash_in)}</span></div>
              <div class="dc-row"><span>+ Cash in</span><span class="dc-ok">+ ${qar(r.cash_in_total || 0)}</span></div>
              <div class="dc-row"><span>− Cash out</span><span class="dc-minus">− ${qar(r.cash_out_total)}</span></div>
              <div class="dc-row dc-total"><span>= Expected cash</span><span>${qar(c ? c.expected_cash : r.expected_cash)}</span></div>
              <div class="dc-row"><span>Counted cash</span><span>${c ? qar(c.counted_cash) : '–'}</span></div>
              <div class="dc-row"><span>Difference</span><span class="${diff === null ? '' : diff === 0 ? 'dc-ok' : diff > 0 ? 'dc-over' : 'dc-minus'}">${diffText}</span></div>
              ${c ? `<p class="dc-note">Closed by ${escapeHtml(c.by || '-')} · ${new Date(c.closed_at).toLocaleString('en-GB', { timeZone: 'Asia/Qatar', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${c.note ? ` · ${escapeHtml(c.note)}` : ''}</p>` : '<p class="dc-note">Cash out and closing the day are done in the till (Day close tab).</p>'}
            </div>
          </div>
        </div>`;
      bindCloseSwitch();
      document.getElementById('closeDay').addEventListener('change', e => { closeDay = e.target.value || qatarDayOffset(0); renderDayClose(); });
      content.querySelectorAll('[data-close-shift]').forEach(b => b.addEventListener('click', () => {
        const d = new Date(`${closeDay}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + Number(b.dataset.closeShift));
        const next = d.toISOString().slice(0, 10);
        if (next <= qatarDayOffset(0)) { closeDay = next; renderDayClose(); }
      }));
    }

    // ---- Delivery areas: the delivery charge for each area ----
    let areas = null;
    async function loadAreas() {
      const { data, error } = await adminSupabase
        .from('delivery_areas').select('id, name, fee, active').order('fee').order('name');
      if (error) throw error;
      return data || [];
    }

    async function renderAreas(message = '') {
      content.innerHTML = '<div class="notice"><p>Loading areas…</p></div>';
      try {
        areas = await loadAreas();
      } catch (error) {
        content.innerHTML = `<div class="notice"><h2>Delivery areas are not set up yet</h2><p>Run <strong>031_delivery_areas.sql</strong> in Supabase, then refresh this page.</p></div>`;
        return;
      }
      if (activeFilter !== 'areas') return;
      const groups = [...new Set(areas.map(a => Number(a.fee)))].sort((a, b) => a - b);
      content.innerHTML = `
        <div id="areasPanel">
          <p class="stock-intro">Customers choose their area at checkout and pay its delivery charge. Areas not on this list can't order delivery online and are asked to call or WhatsApp.</p>
          <div class="area-add">
            <input id="newAreaName" placeholder="New area name">
