<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QAVERA — Orders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* QAVERA v3 palette */
      --beige: #D8D8D8;
      --beige-light: #E6E5E3;
      --beige-mid: #CFCECC;
      --black: #0F0E0E;
      --gold: #C4A980;
      --gold-light: #C4A980;
      --gold-dark: #3D030A;
      --text-dark: #0F0E0E;
      --text-muted: rgba(15,14,14,.66);
      --border: rgba(15,14,14,.16);
      --serif: 'Bodoni Moda', Georgia, serif;
      --sans: 'Instrument Sans', system-ui, sans-serif;
      --mono: 'DM Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--beige);
      color: var(--text-dark);
      font-family: var(--sans);
      font-weight: 400;
      min-height: 100vh;
    }

    header {
      background: var(--black);
      color: var(--beige);
      padding: 18px 16px;
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      color: var(--gold);
      text-decoration: none;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .ghost-button {
      background: transparent;
      border: 1px solid rgba(201,168,76,.45);
      color: var(--gold-light);
      font-family: var(--sans);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }

    .ghost-button:hover { border-color: var(--gold); }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 60px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.4rem;
      margin-bottom: 4px;
    }

    .subtitle { color: var(--text-muted); font-size: .8rem; margin-bottom: 24px; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .filter {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }

    .filter.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--gold-light);
    }

    .filter .count { opacity: .7; margin-left: 4px; }

    /* Day filter + print */
    .day-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -8px 0 22px; }
    .day-bar label { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-right: 2px; }
    .day-bar input { font: inherit; font-size: .85rem; padding: 7px 10px; border: 1px solid var(--border); background: transparent; color: inherit; }
    .day-bar .print-button { margin-left: auto; background: var(--black); border-color: var(--black); color: var(--gold-light); }
    .day-bar[hidden] { display: none; }
    .print-title { display: none; }

    @media print {
      @page { margin: 12mm; }
      body { background: #fff !important; }
      header, .subtitle, .filters, .day-bar, .actions, .contact-links { display: none !important; }
      main { padding: 0 !important; max-width: none !important; }
      main > h1 { display: none; }
      .print-title { display: block; font-family: var(--serif, Georgia, serif); font-weight: 400; font-size: 20px; margin: 0 0 12px; }
      .order-list { gap: 10px; }
      .order { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; border: 1px solid #bbb !important; background: #fff !important; }
    }

    .notice {
      border: 1px dashed rgba(26,23,19,.2);
      background: rgba(235,224,196,.3);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: .85rem;
      line-height: 1.7;
    }

    .notice h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .notice a { color: var(--gold-dark); }

    .order-list { display: grid; gap: 16px; }

    .order {
      background: var(--beige-light);
      border: 1px solid var(--border);
      padding: 22px;
    }

    .order.is-new { border-left: 3px solid var(--gold); }

    .order-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 14px;
    }

    .order-number { font-family: var(--serif); font-size: 1.5rem; }

    .order-time { color: var(--text-muted); font-size: .72rem; margin-top: 2px; }
    .order-when { display: inline-block; margin-top: 8px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; background: #1A2D28; color: #F5EDD9; }
    .order-when.is-pickup { background: #3D030A; }

    .status {
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid rgba(201,168,76,.5);
      color: var(--gold-dark);
      white-space: nowrap;
    }

    .status.pending { background: var(--gold); border-color: var(--gold); color: var(--black); }
    .status.delivered { background: var(--black); border-color: var(--black); color: var(--gold-light); }
    .status.cancelled { color: var(--text-muted); border-color: var(--border); text-decoration: line-through; }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 28px;
    }

    @media (max-width: 680px) {
      .order-grid { grid-template-columns: 1fr; }
    }

    .block-label {
      color: var(--gold-dark);
      font-size: .6rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .block { font-size: .85rem; line-height: 1.7; }

    .block .muted { color: var(--text-muted); }

    .block a { color: var(--text-dark); }

    .contact-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }

    .contact-links a {
      color: var(--gold-dark);
      font-size: .72rem;
      letter-spacing: .08em;
      text-decoration: none;
      border-bottom: 1px solid rgba(154,122,46,.4);
    }

    .address { white-space: pre-line; }

    .items { list-style: none; }

    .items li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: .85rem;
    }

    .items li > span:last-child { white-space: nowrap; }

    .custom-box {
      display: block;
      margin: 8px 0 4px;
      padding: 10px 12px;
      max-width: 260px;
      background: rgba(201,168,76,.12);
      border-left: 2px solid var(--gold);
      font-size: .78rem;
      white-space: normal;
    }

    .flavor-row { display: flex; justify-content: space-between; gap: 18px; line-height: 1.7; }

    .flavor-row strong { font-weight: 500; }

    .custom-label {
      display: block;
      color: var(--gold-dark);
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .totals { margin-top: 8px; font-size: .8rem; }

    .totals div { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-muted); }

    .totals .grand { color: var(--text-dark); font-weight: 500; font-size: .9rem; padding-top: 4px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .action {
      font-family: var(--sans);
      font-size: .65rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 11px 16px;
      cursor: pointer;
      border: 1px solid var(--black);
      background: transparent;
      color: var(--black);
    }

    .action.primary { background: var(--black); color: var(--gold-light); }

    .action.danger { border-color: rgba(26,23,19,.25); color: var(--text-muted); margin-left: auto; }

    .action.danger.armed { background: #7a2e1f; border-color: #7a2e1f; color: #fff; }

    .action:disabled { opacity: .5; cursor: wait; }

    .order-message { width: 100%; font-size: .75rem; color: #7a2e1f; }

    .final-note { color: var(--text-muted); font-size: .75rem; }

    /* v3 details */
    .ghost-button, .filter, .block-label, .status, .action, .order-time, .subtitle, .contact-links a, .final-note { font-family: var(--mono); }
    .brand { font-family: var(--serif); letter-spacing: .28em; }
    h1 { font-weight: 400; }
    .order-number { font-weight: 400; }
    .status.pending { background: var(--black); border-color: var(--black); color: var(--gold); }
    .status.delivered { background: #1A2D28; border-color: #1A2D28; color: var(--beige); }
    .custom-box { background: rgba(61,3,10,.07); border-left-color: var(--gold-dark); }
    .order.is-new { border-left-color: var(--gold); }

    /* Stock tab */
    .stock-intro { margin: 0 0 18px; color: var(--muted, #6f6a64); font-size: 14px; line-height: 1.5; }
    .stock-message { color: #b00020; font-size: 14px; min-height: 1em; margin-bottom: 8px; }
    .stock-group { margin-bottom: 26px; }
    .stock-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
    .stock-name { font-size: 15px; }
    .stock-state { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #2e7d32; }
    .area-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .area-add input, .area-row input { font: inherit; font-size: .9rem; padding: 8px 10px; border: 1px solid var(--border); background: #fff; color: inherit; }
    .area-add #newAreaName { flex: 1 1 200px; }
    .area-add #newAreaFee, .area-row input { width: 90px; }
    .area-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
    .area-row .action { margin: 0; padding: 8px 12px; }
    .area-row .action.danger { margin-left: 0; }
    .stock-message.ok { color: #2e7d32; }
    @media (max-width: 560px) { .area-row { grid-template-columns: 1fr auto; } }
    .stock-row.is-out .stock-name { opacity: .55; text-decoration: line-through; }
    .stock-row.is-out .stock-state { color: #b00020; }
    .stock-row .action { margin: 0; white-space: nowrap; }
    @media (max-width: 560px) {
      .stock-row { grid-template-columns: 1fr auto; }
      .stock-row .action { grid-column: 1 / -1; justify-self: start; }
    }

    /* New order (WhatsApp / phone) */
    .new-order { background: var(--beige-light); border: 1px solid var(--border); padding: 22px; display: grid; gap: 22px; }
    .no-section { display: grid; gap: 10px; }
    .no-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .no-field { display: grid; gap: 4px; }
    .no-field label, .no-section > .block-label { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
    .no-field input, .no-field select, .no-field textarea { font: inherit; font-size: .9rem; padding: 9px 10px; border: 1px solid var(--border); background: #fff; color: inherit; width: 100%; }
    .no-choice { display: flex; flex-wrap: wrap; gap: 8px; }
    .no-choice label { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); background: #fff; font-size: .85rem; cursor: pointer; }
    .no-choice label:has(input:checked) { border-color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }
    .no-add { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; align-items: end; }
    .no-items { list-style: none; display: grid; gap: 6px; }
    .no-items li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; padding: 8px 10px; background: #fff; border: 1px solid var(--border); }
    .no-items button { border: 0; background: none; color: #7a2e1f; cursor: pointer; font: inherit; font-size: .75rem; text-decoration: underline; }
    .no-totals { font-size: .9rem; display: grid; gap: 4px; max-width: 360px; margin-left: auto; width: 100%; }
    .no-totals div { display: flex; justify-content: space-between; }
    .no-totals .grand { font-weight: 600; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }
    .no-check { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
    .no-flavours { border: 1px solid var(--border); background: #fff; padding: 12px 14px; display: grid; gap: 6px; }
    .no-flavours[hidden] { display: none; }
    .no-flv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; margin-bottom: 4px; }
    .no-flv-head span { color: var(--text-muted); margin-right: auto; }
    .no-flv-head button, .no-flv-row button { font: inherit; font-size: .8rem; border: 1px solid var(--border); background: #fff; padding: 4px 10px; cursor: pointer; }
    .no-flv-row { display: grid; grid-template-columns: 1fr 34px 34px 34px; align-items: center; gap: 6px; font-size: .88rem; }
    .no-flv-row b { text-align: center; }
    .no-flv-row button:disabled { opacity: .35; cursor: default; }
    .no-flv-note { font-size: .8rem; color: #7a2e1f; min-height: 1em; }
    .no-flv-list { display: block; color: var(--text-muted); font-size: .78rem; }
    .no-message { font-size: .85rem; color: #7a2e1f; min-height: 1em; }
    .no-message.ok { color: #2e7d32; }
    .new-order [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .no-grid { grid-template-columns: 1fr; }
      .no-add { grid-template-columns: 1fr 70px; }
      .no-add .action { grid-column: 1 / -1; }
    }
    /* Gifts and Fawran */
    .gift-tag { display: inline-block; margin: 8px 0 0 6px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; background: var(--gold); color: var(--black); }
    .pay-tag { display: inline-block; margin: 8px 0 0 6px; padding: 4px 10px; font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; border: 1px solid #7a2e1f; color: #7a2e1f; }
    .pay-tag.paid { border-color: #2e7d32; color: #2e7d32; }
    .gift-card { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--gold); background: rgba(196,169,128,.12); font-style: italic; white-space: pre-line; }
    .wa-row { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .wa-label { font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
    .wa-send { font-family: var(--sans); font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; padding: 9px 14px; border: 1px solid #1f8f4e; color: #1f8f4e; text-decoration: none; background: transparent; }
    .wa-send::before { content: '💬 '; }
    .invoice-btn { font-family: var(--sans); font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; padding: 9px 14px; border: 1px solid var(--black); color: var(--black); background: transparent; cursor: pointer; margin-right: 8px; }
    .action.paid-button { border-color: #2e7d32; color: #2e7d32; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="home.html">QAVERA</a>
      <div class="header-actions">
        <button class="ghost-button" id="refreshButton" type="button">Refresh</button>
        <button class="ghost-button" id="logoutButton" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <h1>Orders</h1>
    <p class="subtitle" id="subtitle">Loading…</p>

    <div class="filters" id="filters" hidden></div>
    <div class="day-bar" id="dayBar" hidden>
      <label for="dayFrom">From</label>
      <input type="date" id="dayFrom">
      <label for="dayTo">To</label>
      <input type="date" id="dayTo">
      <button type="button" class="filter" data-day="today">Today</button>
      <button type="button" class="filter" data-day="tomorrow">Tomorrow</button>
      <button type="button" class="filter" data-day="">All days</button>
      <button type="button" class="filter print-button" id="printButton">Print these orders</button>
    </div>
    <h2 class="print-title" id="printTitle"></h2>
    <div id="content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const adminSupabase = window.supabase.createClient(
      'https://rhwajaceuhpfwughlgpd.supabase.co',
      'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0'
    );

    const STATUS_LABELS = {
      pending: 'New',
      confirmed: 'Confirmed',
      preparing: 'Preparing',
      out_for_delivery: 'Out for delivery',
      delivered: 'Delivered',
      cancelled: 'Cancelled'
    };

    // The normal order of steps; the primary button moves an order one step forward.
    const FLOW = ['pending', 'confirmed', 'preparing', 'out_for_delivery', 'delivered'];

    const ACTION_LABELS = {
      confirmed: 'Confirm',
      preparing: 'Preparing',
      out_for_delivery: 'Out for delivery',
      delivered: 'Delivered'
    };

    // Pickup orders use the same steps with pickup wording.
    const PICKUP_STATUS_LABELS = { out_for_delivery: 'Ready for pickup', delivered: 'Collected' };
    const PICKUP_ACTION_LABELS = { out_for_delivery: 'Ready for pickup', delivered: 'Collected' };
    const SLOT_LABELS = {
      '12:00-16:00': '12 PM – 4 PM', '18:00-23:00': '6 PM – 11 PM',
      '10:00-14:00': '10 AM – 2 PM', '16:00-21:00': '4 PM – 9 PM', '13:00-18:00': '1 PM – 6 PM'
    };
    const isPickup = order => order.fulfillment_type === 'pickup';
    const statusLabel = order => (isPickup(order) && PICKUP_STATUS_LABELS[order.status]) || STATUS_LABELS[order.status] || order.status;
    const actionLabel = (order, status) => (isPickup(order) && PICKUP_ACTION_LABELS[status]) || ACTION_LABELS[status];

    function scheduleLabel(order) {
      if (!order.scheduled_date) return '';
      const date = new Date(`${order.scheduled_date}T12:00:00Z`).toLocaleDateString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
      });
      return `${date} · ${SLOT_LABELS[order.time_slot] || order.time_slot || ''}`;
    }

    const FILTERS = [
      { key: 'active', label: 'To do', match: o => !isShopSale(o) && !['delivered', 'cancelled'].includes(o.status) },
      { key: 'delivered', label: 'Delivered', match: o => !isShopSale(o) && o.status === 'delivered' },
      { key: 'cancelled', label: 'Cancelled', match: o => o.status === 'cancelled' },
      { key: 'shop', label: 'Shop sales', match: o => isShopSale(o) && o.status !== 'cancelled' },
      { key: 'all', label: 'All', match: () => true },
      { key: 'stock', label: 'Stock', match: () => false },
      { key: 'areas', label: 'Delivery areas', match: () => false },
      { key: 'new', label: '+ New order', match: () => false }
    ];

    // Products on sale, for the Stock tab. null = could not load (SQL 015 not run yet).
    let products = [];
    const STOCK_GROUPS = [
      { label: 'Boxes', match: p => !p.category },
      { label: 'Wrapped Chocolate', match: p => p.category === 'assorted' },
      { label: 'Slabs', match: p => p.category === 'slabs' },
      { label: 'Spreads', match: p => p.category === 'spreads' },
      { label: 'Other', match: p => !!p.category && !['assorted', 'slabs', 'spreads'].includes(p.category) }
    ];

    const PAYMENT_LABELS = {
      cash_on_delivery: 'Cash on delivery',
      card_on_delivery: 'Card on delivery',
      fawran: 'Fawran',
      cash: 'Cash in shop',
      card: 'Card in shop'
    };

    // Sales made in the shop with the POS app.
    const isShopSale = order => order.source === 'store';

    let orders = [];
    let activeFilter = 'active';
    // Date range (YYYY-MM-DD, Qatar). Empty = no limit on that side.
    let dayFrom = '';
    let dayTo = '';

    // Day an order belongs to: its delivery / pickup date, or for shop sales the day it was sold.
    const qatarDay = value => new Date(value).toLocaleDateString('en-CA', { timeZone: 'Asia/Qatar' });
    const orderDay = order => order.scheduled_date || qatarDay(order.created_at);
    const dayMatch = order => {
      const day = orderDay(order);
      return (!dayFrom || day >= dayFrom) && (!dayTo || day <= dayTo);
    };
    function qatarDayOffset(days) {
      const d = new Date(`${qatarDay(Date.now())}T12:00:00Z`);
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    const dayLabel = day => new Date(`${day}T12:00:00Z`).toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
    });
    function rangeLabel() {
      if (!dayFrom && !dayTo) return 'All days';
      if (dayFrom && dayFrom === dayTo) return dayLabel(dayFrom);
      if (dayFrom && dayTo) return `${dayLabel(dayFrom)} to ${dayLabel(dayTo)}`;
      return dayFrom ? `From ${dayLabel(dayFrom)}` : `Until ${dayLabel(dayTo)}`;
    }
    let isAdmin = false;

    const content = document.getElementById('content');
    const subtitle = document.getElementById('subtitle');
    const filtersEl = document.getElementById('filters');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function qar(value) {
      const amount = Number(value || 0);
      return `QAR ${Number.isInteger(amount) ? amount : amount.toFixed(2)}`;
    }

    function formatTime(value) {
      if (!value) return '';
      return new Date(value).toLocaleString('en-GB', {
        timeZone: 'Asia/Qatar',
        weekday: 'short', day: 'numeric', month: 'short',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function showNotice(title, text) {
      filtersEl.hidden = true;
      content.innerHTML = `<div class="notice"><h2>${escapeHtml(title)}</h2><p>${text}</p></div>`;
    }

    async function init() {
      const { data: { session } } = await adminSupabase.auth.getSession();

      if (!session) {
        window.location.replace('login.html?next=admin.html');
        return;
      }

      const { data: allowed, error } = await adminSupabase.rpc('is_admin');

      if (error || !allowed) {
        subtitle.textContent = '';
        showNotice('Not available', 'This page is only for QAVERA staff. <a href="home.html">Back to the shop</a>');
        return;
      }

      isAdmin = true;
      await loadOrders();

      // Keep the list fresh while the page is open.
      setInterval(() => { if (!document.hidden) loadOrders(); }, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) loadOrders(); });
    }

    async function loadOrders() {
      if (!isAdmin) return;

      const productsRequest = adminSupabase
        .from('products').select('id, name, category, in_stock').eq('active', true).order('name');

      const { data, error } = await adminSupabase
        .from('orders')
        .select('*, order_items(product_name, variant_name, quantity, total_price, customization)')
        .order('created_at', { ascending: false })
        .limit(300);

      if (error) {
        console.error('Could not load orders:', error);
        showNotice('Could not load orders', escapeHtml(error.message));
        return;
      }

      orders = data || [];
      const productsResult = await productsRequest;
      products = productsResult.error ? null : (productsResult.data || []);
      const updated = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Qatar', hour: '2-digit', minute: '2-digit' });
      subtitle.textContent = `${orders.length} order${orders.length === 1 ? '' : 's'} · updated ${updated}`;
      render();
    }

    function renderFilters() {
      filtersEl.hidden = false;
      filtersEl.innerHTML = FILTERS.map(filter => {
        const count = filter.key === 'stock'
          ? (products || []).filter(p => p.in_stock === false).length
          : orders.filter(o => dayMatch(o) && filter.match(o)).length;
        const countLabel = (filter.key === 'new' || filter.key === 'areas') ? '' : filter.key === 'stock' ? (count ? `${count} sold out` : '') : count;
        return `<button type="button" class="filter ${filter.key === activeFilter ? 'active' : ''}" data-filter="${filter.key}">
          ${filter.label}<span class="count">${countLabel}</span>
        </button>`;
      }).join('');
    }

    // ---- WhatsApp: the same messages as the emails, ready to send ----
    const SHOP_ADDRESS = 'QAVERA shop, Zone 55, Street 162, Building 44';
    const FAWRAN_DETAILS = 'Corporate · Qavera Trading · CR 237335';
    // Phone in international form for wa.me; 8-digit numbers are Qatari.
    function waDigits(phone) {
      const digits = String(phone || '').replace(/\D/g, '').replace(/^00/, '');
      return digits.length === 8 ? `974${digits}` : digits;
    }
    const waFirstName = name => String(name || '').trim().split(/\s+/)[0] || '';
    function waWhen(order) {
      if (!order.scheduled_date) return '';
      const date = new Date(`${order.scheduled_date}T12:00:00Z`).toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
      });
      return `${date}, ${SLOT_LABELS[order.time_slot] || order.time_slot || ''}`;
    }
    function waPayment(order) {
      const label = PAYMENT_LABELS[order.payment_method] || order.payment_method;
      return isPickup(order) ? label.replace('delivery', 'pickup') : label;
    }

    // Messages that fit the order's current step: [{ label, phone, text }].
    function waMessages(order) {
      if (isShopSale(order) || order.status === 'cancelled') return [];
      const hello = `Hello ${waFirstName(order.customer_name)},`.replace(' ,', ',');
      const number = order.order_number;
      const total = `Total: ${qar(order.total)} (${waPayment(order)})`;
      const when = waWhen(order);
      const kind = isPickup(order) ? 'Pickup' : 'Delivery';
      const fawranDue = order.payment_method === 'fawran' && order.payment_status !== 'paid';
      const fawranText = `Please send ${qar(order.total)} by Fawran to ${FAWRAN_DETAILS}, with ${number} in the note. We will prepare your order as soon as we receive it.`;
      const gift = order.is_gift ? `\nGift for: ${order.gift_recipient_name}` : '';
      const list = [];

      if (order.status === 'pending' || order.status === 'confirmed' || order.status === 'preparing') {
        const opening = order.status === 'pending'
          ? `Thank you for your QAVERA order ${number}.`
          : `Your QAVERA order ${number} is confirmed.`;
        list.push({
          label: order.status === 'pending' ? 'Order received' : 'Order confirmed',
          text: `${hello}\n\n${opening}${gift}${when ? `\n${kind}: ${when}` : ''}\n${total}${fawranDue ? `\n\n${fawranText}` : ''}\n\nQAVERA`
        });
      }
      if (order.status === 'out_for_delivery') {
        list.push(isPickup(order)
          ? { label: 'Ready for pickup', text: `${hello}\n\nYour QAVERA order ${number} is ready to collect${when ? ` on ${when}` : ''}.\n${SHOP_ADDRESS}\n${total}\n\nQAVERA` }
          : { label: 'On its way', text: `${hello}\n\nYour QAVERA order ${number} is out for delivery${order.is_gift ? ` to ${order.gift_recipient_name}` : ' and will reach you soon'}.\n${total}\n\nQAVERA` });
        if (order.is_gift && order.gift_recipient_phone) {
          list.push({
            label: 'Tell the recipient',
            phone: order.gift_recipient_phone,
            text: `Hello ${waFirstName(order.gift_recipient_name)},\n\nA QAVERA gift from ${order.customer_name} is on its way to you and will arrive soon.${order.gift_message ? `\n\n“${order.gift_message}”` : ''}\n\nQAVERA`
          });
        }
      }
      if (order.status === 'delivered') {
        const points = Number(order.points_earned || 0);
        list.push({
          label: isPickup(order) ? 'Collected' : 'Delivered',
          text: `${hello}\n\nYour QAVERA order ${number} has been ${isPickup(order) ? 'collected' : 'delivered'}. Thank you for choosing QAVERA.${points > 0 ? `\nYou earned ${points} QAVERA points with this order.` : ''}\n\nQAVERA`
        });
      }
      if (order.payment_method === 'fawran') {
        list.push(fawranDue
          ? { label: 'Fawran reminder', text: `${hello}\n\n${fawranText}\n\nOrder ${number}\n\nQAVERA` }
          : { label: 'Fawran received', text: `${hello}\n\nWe have received your Fawran payment of ${qar(order.total)} for order ${number}. Thank you!\n\nQAVERA` });
      }

      return list
        .map(m => ({ ...m, digits: waDigits(m.phone || order.customer_phone) }))
        .filter(m => m.digits.length >= 8);
    }

    function renderWhatsApp(order) {
      if (isShopSale(order) || order.status === 'cancelled') return '';
      const messages = waMessages(order);
      return `<div class="wa-row">
        <button type="button" class="invoice-btn" data-invoice="${order.id}">🧾 Invoice (PDF)</button>
        ${messages.length ? `<span class="wa-label">WhatsApp</span>${messages.map(m =>
          `<a class="wa-send" href="https://wa.me/${m.digits}?text=${encodeURIComponent(m.text)}" target="_blank" rel="noopener">${escapeHtml(m.label)}</a>`
        ).join('')}` : ''}
      </div>`;
    }

    // ---- Invoice: an A4 page to save as PDF and send to the customer ----
    // The logo is embedded in the invoice so the PDF is complete on its own.
    let invoiceLogo = `${location.origin}/email-logo.png`;
    fetch('email-logo.png').then(r => r.ok ? r.blob() : null).then(blob => {
      if (!blob) return;
      const reader = new FileReader();
      reader.onload = () => { invoiceLogo = reader.result; };
      reader.readAsDataURL(blob);
    }).catch(() => {});

    function invoiceHtml(order) {
      const pickup = isPickup(order);
      const fawran = order.payment_method === 'fawran';
      const paid = order.payment_status === 'paid';
      const placed = new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Qatar' });
      const rows = (order.order_items || []).map(item => {
        const flavors = Array.isArray(item.customization)
          ? item.customization.filter(f => Number(f.quantity) > 0).map(f => `${escapeHtml(f.name)} × ${Number(f.quantity)}`).join(', ')
          : '';
        const unit = Number(item.total_price) / Math.max(Number(item.quantity) || 1, 1);
        return `<tr>
          <td>${escapeHtml(item.product_name)} — ${escapeHtml(item.variant_name)}${flavors ? `<div class="sub">${flavors}</div>` : ''}</td>
          <td class="c">${Number(item.quantity)}</td>
          <td class="r">${qar(unit)}</td>
          <td class="r">${qar(item.total_price)}</td>
        </tr>`;
      }).join('');
      const line = (label, value, cls = '') => `<div class="line ${cls}"><span>${label}</span><span>${value}</span></div>`;
      const payment = String(PAYMENT_LABELS[order.payment_method] || order.payment_method || '').replace(pickup ? 'delivery' : '§', 'pickup');

      return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAVERA invoice ${escapeHtml(order.order_number)}</title>
<style>

  @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } .totals { width: 100%; } .head { flex-direction: column; align-items: flex-start; } .head .shop { text-align: left; } }
</style></head><body>
<div class="bar">Choose <strong>Save as PDF</strong> in the print window, then send it on WhatsApp. <button type="button" onclick="window.print()">Print / Save PDF</button></div>
<div class="page">
  <div class="head">
    <img src="${invoiceLogo}" alt="QAVERA">
    <div class="shop">QAVERA · Qavera Trading<br>Zone 55, Street 162, Building 44, Doha<br>+974 5096 8968 · qavera.qa</div>
  </div>

  <h1>Invoice</h1>
  <div class="meta">${escapeHtml(order.order_number)} · ${escapeHtml(placed)}</div>

  <div class="cols">
    <div class="box">
      <div class="label">Bill to</div>
      <div>${escapeHtml(order.customer_name)}</div>
      <div>${escapeHtml(order.customer_phone || '')}</div>
      ${order.customer_email ? `<div>${escapeHtml(order.customer_email)}</div>` : ''}
    </div>
    <div class="box">
      <div class="label">${pickup ? 'Pickup' : 'Delivery'}${order.is_gift ? ' · Gift' : ''}</div>
      ${scheduleLabel(order) ? `<div><strong>${escapeHtml(scheduleLabel(order))}</strong></div>` : ''}
      ${order.is_gift ? `<div>For ${escapeHtml(order.gift_recipient_name)} · ${escapeHtml(order.gift_recipient_phone || '')}</div>` : ''}
      <div class="pre">${pickup ? 'QAVERA shop, Zone 55, Street 162, Building 44' : `${escapeHtml(order.delivery_area || '')}\n${escapeHtml(order.delivery_address || '')}`}</div>

  <table>

  <div class="totals">
    ${line('Subtotal', qar(order.subtotal))}
    ${Number(order.points_discount) > 0 ? line(`Points (${Number(order.points_used)})`, `− ${qar(order.points_discount)}`) : ''}
    ${Number(order.discount_amount) > 0 ? line(`Discount${order.discount_reason ? ` (${escapeHtml(order.discount_reason)})` : ''}`, `− ${qar(order.discount_amount)}`) : ''}
    ${pickup ? line('Pickup', 'Free') : line('Delivery', qar(order.delivery_fee))}
    ${line('Total', qar(order.total), 'total')}
    ${line('Payment', escapeHtml(payment))}
  </div>

  ${fawran && !paid ? `<div class="pay">
    <div class="label">How to pay</div>
    <strong>Please send ${qar(order.total)} by Fawran</strong><br>
    To: ${escapeHtml(FAWRAN_DETAILS)}<br>
    Note: ${escapeHtml(order.order_number)}<br>
    We will prepare your order as soon as we receive it.
  </div>` : ''}
  ${paid ? '<div class="stamp">PAID</div>' : ''}

  <div class="foot">Thank you for choosing QAVERA.</div>
</div>
<script>
  // Open the print window once the logo has loaded (Save as PDF from there).
  const img = document.querySelector('.head img');
  const go = () => setTimeout(() => window.print(), 300);
  if (img.complete) go(); else { img.onload = go; img.onerror = go; }
<\/script>
</body></html>`;
    }

    function openInvoice(order) {
      const win = window.open('', '_blank');
      if (!win) {
        alert('Please allow pop-ups for this page to open the invoice.');
        return;
      }
      win.document.open();
      win.document.write(invoiceHtml(order));
      win.document.close();
    }

    function renderActions(order) {
      if (isShopSale(order) && order.status === 'delivered') {
        return `<div class="actions"><span class="final-note">Paid in the shop</span></div>`;
      }
      const fawranButton = order.payment_method !== 'fawran' ? ''
        : order.payment_status === 'paid'
        ? `<button type="button" class="action paid-button" data-paid="${order.id}" data-value="false">Fawran received ✓ (undo)</button>`
        : `<button type="button" class="action primary" data-paid="${order.id}" data-value="true">Fawran received</button>`;
      if (order.status === 'delivered') {
        return `<div class="actions">${order.payment_status === 'paid' ? '' : fawranButton}<span class="final-note">${isPickup(order) ? 'Collected' : 'Delivered'}${Number(order.points_earned) > 0 ? ` · ${Number(order.points_earned)} points given` : ''}</span>${renderWhatsApp(order)}<div class="order-message" id="msg-${order.id}"></div></div>`;
      }
      if (order.status === 'cancelled') {
        return `<div class="actions"><span class="final-note">Cancelled${Number(order.points_used) > 0 ? ' · points returned to the customer' : ''}</span></div>`;
      }

      const index = FLOW.indexOf(order.status);
      const next = FLOW[index + 1];
      const buttons = fawranButton ? [fawranButton] : [];

      if (next) {
        buttons.push(`<button type="button" class="action primary" data-id="${order.id}" data-status="${next}">${actionLabel(order, next)}</button>`);
      }
      if (next !== 'delivered') {
        buttons.push(`<button type="button" class="action" data-id="${order.id}" data-status="delivered">${actionLabel(order, 'delivered')}</button>`);
      }
      buttons.push(`<button type="button" class="action danger" data-id="${order.id}" data-status="cancelled">Cancel order</button>`);

      return `<div class="actions">${buttons.join('')}${renderWhatsApp(order)}<div class="order-message" id="msg-${order.id}"></div></div>`;
    }

    function renderOrder(order) {
      const digits = String(order.customer_phone || '').replace(/\D/g, '');

      const items = (order.order_items || []).map(item => {
        const flavors = Array.isArray(item.customization)
          ? item.customization.filter(f => Number(f.quantity) > 0)
              .map(f => `<span class="flavor-row"><span>${escapeHtml(f.name)}</span><strong>${Number(f.quantity)}</strong></span>`).join('')
          : '';
        return `<li>
          <span>${escapeHtml(item.product_name)} — ${escapeHtml(item.variant_name)} × ${Number(item.quantity)}
            ${flavors ? `<span class="custom-box"><span class="custom-label">Customized · per box</span>${flavors}</span>` : ''}</span>
          <span>${qar(item.total_price)}</span>
        </li>`;
      }).join('');

      return `
        <article class="order ${order.status === 'pending' ? 'is-new' : ''}">
          <div class="order-top">
            <div>
              <div class="order-number">${escapeHtml(order.order_number)}</div>
              <div class="order-time">${escapeHtml(formatTime(order.created_at))}</div>
              ${scheduleLabel(order) ? `<div class="order-when ${isPickup(order) ? 'is-pickup' : ''}">${isPickup(order) ? 'Pickup' : 'Delivery'} · ${escapeHtml(scheduleLabel(order))}</div>` : ''}${order.is_gift ? '<span class="gift-tag">🎁 Gift</span>' : ''}${order.payment_method === 'fawran' ? `<span class="pay-tag ${order.payment_status === 'paid' ? 'paid' : ''}">${order.payment_status === 'paid' ? 'Fawran received' : 'Waiting for Fawran'}</span>` : ''}
            </div>
            <span class="status ${escapeHtml(order.status)}">${isShopSale(order) && order.status === 'delivered' ? 'Shop sale' : escapeHtml(statusLabel(order))}</span>
          </div>

          <div class="order-grid">
            <div>
              <div class="block-label">${order.is_gift ? 'Customer (paying)' : 'Customer'}</div>
              <div class="block">
                ${escapeHtml(order.customer_name)}
                ${digits ? `<br><a href="tel:+${digits}">${escapeHtml(order.customer_phone)}</a>` : ''}
                ${order.customer_email ? `<br><span class="muted">${escapeHtml(order.customer_email)}</span>` : ''}
                ${order.source === 'whatsapp' ? `<br><span class="muted">Ordered on WhatsApp / phone</span>` : ''}
                ${digits ? `<div class="contact-links">
                  <a href="https://wa.me/${waDigits(digits)}" target="_blank" rel="noopener">WhatsApp</a>
                  <a href="tel:+${digits}">Call</a>
                </div>` : ''}
              </div>

              ${order.is_gift ? (() => {
                const giftDigits = String(order.gift_recipient_phone || '').replace(/\D/g, '');
                return `<div class="block-label" style="margin-top:16px;">🎁 Gift for</div>
              <div class="block">
                ${escapeHtml(order.gift_recipient_name)}
                ${giftDigits ? `<br><a href="tel:+${giftDigits}">${escapeHtml(order.gift_recipient_phone)}</a>
                <div class="contact-links"><a href="https://wa.me/${waDigits(giftDigits)}" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+${giftDigits}">Call</a></div>` : ''}
                ${order.gift_message ? `<div class="gift-card">“${escapeHtml(order.gift_message)}”</div>` : ''}
              </div>`;
              })() : ''}
              ${isShopSale(order) ? `<div class="block-label" style="margin-top:16px;">Sold in</div>
              <div class="block">The QAVERA shop</div>` : isPickup(order) ? `<div class="block-label" style="margin-top:16px;">Pickup</div>
              <div class="block">Customer collects from the shop</div>` : `<div class="block-label" style="margin-top:16px;">Deliver to</div>
              <div class="block address">${escapeHtml(order.delivery_area)}
${escapeHtml(order.delivery_address)}</div>`}
              ${order.notes ? `<div class="block muted" style="margin-top:6px;">Notes: ${escapeHtml(order.notes)}</div>` : ''}
            </div>

            <div>
              <div class="block-label">Items</div>
              <ul class="items">${items}</ul>
              <div class="totals">
                <div><span>Subtotal</span><span>${qar(order.subtotal)}</span></div>
                ${Number(order.points_discount) > 0 ? `<div><span>Points (${Number(order.points_used)})</span><span>− ${qar(order.points_discount)}</span></div>` : ''}
                ${Number(order.discount_amount) > 0 ? `<div><span>${isShopSale(order) ? 'Shop discount' : 'Discount'}${order.discount_reason ? ` · ${escapeHtml(order.discount_reason)}` : ''}</span><span>− ${qar(order.discount_amount)}</span></div>` : ''}
                ${isShopSale(order) ? '' : isPickup(order) ? `<div><span>Pickup</span><span>Free</span></div>` : `<div><span>Delivery</span><span>${qar(order.delivery_fee)}</span></div>`}
                <div class="grand"><span>Total · ${escapeHtml(isPickup(order) ? String(PAYMENT_LABELS[order.payment_method] || order.payment_method).replace('delivery', 'pickup') : (PAYMENT_LABELS[order.payment_method] || order.payment_method))}</span><span>${qar(order.total)}</span></div>
              </div>
            </div>
          </div>

          ${renderActions(order)}
        </article>`;
    }

    function renderStock() {
      if (!products) {
        content.innerHTML = `<div class="notice"><h2>Stock is not set up yet</h2><p>Run <strong>015_out_of_stock.sql</strong> in Supabase, then refresh this page.</p></div>`;
        return;
      }
      const groups = STOCK_GROUPS.map(group => {
        const list = products.filter(group.match);
        if (!list.length) return '';
        return `<section class="stock-group">
          <div class="block-label">${group.label}</div>
          ${list.map(p => `<div class="stock-row ${p.in_stock === false ? 'is-out' : ''}">
            <span class="stock-name">${escapeHtml(p.name)}</span>
            <span class="stock-state">${p.in_stock === false ? 'Sold out' : 'In stock'}</span>
            <button type="button" class="action ${p.in_stock === false ? 'primary' : ''} stock-toggle" data-product="${p.id}" data-in-stock="${p.in_stock === false ? 'true' : 'false'}">
              ${p.in_stock === false ? 'Back in stock' : 'Mark sold out'}
            </button>
          </div>`).join('')}
        </section>`;
      }).join('');
      content.innerHTML = `<p class="stock-intro">Sold-out products stay on the website with a "Sold out" label and can't be ordered. The shop till shows them greyed out.</p>
        <div class="stock-message" id="stockMessage" role="alert"></div>${groups}`;
    }

    async function setStock(button) {
      const message = document.getElementById('stockMessage');
      button.disabled = true;
      if (message) message.textContent = '';
      const { error } = await adminSupabase.rpc('admin_set_product_stock', {
        p_product_id: button.dataset.product,
        p_in_stock: button.dataset.inStock === 'true'
      });
      if (error) {
        console.error('Could not change stock:', error);
        if (message) message.textContent = error.message || 'Could not change stock.';
        button.disabled = false;
        return;
      }
      await loadOrders();
    }

    function renderDayBar() {
      const bar = document.getElementById('dayBar');
      bar.hidden = ['stock', 'new', 'areas'].includes(activeFilter);
      document.getElementById('dayFrom').value = dayFrom;
      document.getElementById('dayTo').value = dayTo;
      bar.querySelectorAll('[data-day]').forEach(b => {
        const target = b.dataset.day === 'today' ? qatarDayOffset(0) : b.dataset.day === 'tomorrow' ? qatarDayOffset(1) : '';
        b.classList.toggle('active', dayFrom === target && dayTo === target);
      });
      const filter = FILTERS.find(f => f.key === activeFilter);
      document.getElementById('printTitle').textContent =
        `QAVERA · ${filter ? filter.label : ''} · ${rangeLabel()}`;
    }

    function render() {
      renderFilters();
      renderDayBar();
      if (activeFilter === 'stock') {
        renderStock();
        return;
      }
      if (activeFilter === 'areas') {
        if (!document.getElementById('areasPanel')) renderAreas();
        return;
      }
      if (activeFilter === 'new') {
        // Keep what has been typed when the list refreshes in the background.
        if (!document.getElementById('newOrderForm')) renderNewOrder();
        return;
      }
      const filter = FILTERS.find(f => f.key === activeFilter);
      const visible = orders.filter(o => dayMatch(o) && filter.match(o));
      // To do: soonest delivery / pickup first.
      if (activeFilter === 'active') {
        visible.sort((a, b) => String(a.scheduled_date || '9999') .localeCompare(String(b.scheduled_date || '9999'))
          || String(a.time_slot || '').localeCompare(String(b.time_slot || '')));
      }

      if (!visible.length) {
        content.innerHTML = `<div class="notice"><h2>Nothing here</h2><p>${(dayFrom || dayTo) ? `No orders in this list for ${escapeHtml(rangeLabel())}.` : activeFilter === 'active' ? 'No orders waiting. New orders will appear here.' : 'No orders in this list yet.'}</p></div>`;
        return;
      }

      content.innerHTML = `<div class="order-list">${visible.map(renderOrder).join('')}</div>`;
    }

    // ---- Delivery areas: the delivery charge for each area ----
    let areas = null;
    async function loadAreas() {
      const { data, error } = await adminSupabase
        .from('delivery_areas').select('id, name, fee, active').order('fee').order('name');
      if (error) throw error;
      return data || [];
    }

    async function renderAreas(message = '') {
      content.innerHTML = '<div class="notice"><p>Loading areas…</p></div>';
      try {
        areas = await loadAreas();
      } catch (error) {
        content.innerHTML = `<div class="notice"><h2>Delivery areas are not set up yet</h2><p>Run <strong>031_delivery_areas.sql</strong> in Supabase, then refresh this page.</p></div>`;
        return;
      }
      if (activeFilter !== 'areas') return;
      const groups = [...new Set(areas.map(a => Number(a.fee)))].sort((a, b) => a - b);
      content.innerHTML = `
        <div id="areasPanel">
          <p class="stock-intro">Customers choose their area at checkout and pay its delivery charge. Areas not on this list can't order delivery online and are asked to call or WhatsApp.</p>
          <div class="area-add">
            <input id="newAreaName" placeholder="New area name">
            <input id="newAreaFee" type="number" min="0" step="1" placeholder="QAR">
            <button type="button" class="action primary" data-area-add>Add area</button>
          </div>
          <div class="stock-message ${message.startsWith('✓') ? 'ok' : ''}" id="areasMessage" role="alert">${escapeHtml(message)}</div>
          ${groups.map(fee => {
            const list = areas.filter(a => Number(a.fee) === fee);
            return `<section class="stock-group">
              <div class="block-label">QAR ${fee} · ${list.length} area${list.length === 1 ? '' : 's'}</div>
              ${list.map(a => `<div class="area-row" data-area="${a.id}">
                <span class="stock-name">${escapeHtml(a.name)}</span>
                <input type="number" min="0" step="1" value="${Number(a.fee)}" aria-label="Delivery charge for ${escapeHtml(a.name)}">
                <button type="button" class="action" data-area-save>Save</button>
                <button type="button" class="action danger" data-area-remove>Remove</button>
              </div>`).join('')}
            </section>`;
          }).join('')}
        </div>`;
    }

    async function areasClick(event) {
      const button = event.target.closest('button');
      if (!button) return;
      const message = document.getElementById('areasMessage');
      const row = button.closest('[data-area]');
      let result = null;
      let done = '';

      if (button.hasAttribute('data-area-add')) {
        const name = document.getElementById('newAreaName').value.trim();
        const fee = Number(document.getElementById('newAreaFee').value);
        if (!name || !(fee >= 0) || document.getElementById('newAreaFee').value === '') {
          message.textContent = 'Enter the area name and its delivery charge.';
          return;
        }
        result = await adminSupabase.from('delivery_areas').insert({ name, fee });
        done = `✓ ${name} added at QAR ${fee}`;
      } else if (button.hasAttribute('data-area-save')) {
        const fee = Number(row.querySelector('input').value);
        if (!(fee >= 0) || row.querySelector('input').value === '') { message.textContent = 'Enter a delivery charge.'; return; }
        result = await adminSupabase.from('delivery_areas').update({ fee }).eq('id', row.dataset.area);
        done = `✓ ${row.querySelector('.stock-name').textContent} is now QAR ${fee}`;
      } else if (button.hasAttribute('data-area-remove')) {
        // Removing needs a second tap so it can't happen by accident.
        if (!button.classList.contains('armed')) {
          button.classList.add('armed');
          button.textContent = 'Tap again to remove';
          return;
        }
        result = await adminSupabase.from('delivery_areas').delete().eq('id', row.dataset.area);
        done = `✓ ${row.querySelector('.stock-name').textContent} removed`;
      } else {
        return;
      }

      if (result.error) {
        console.error('Could not change delivery areas:', result.error);
        message.textContent = /duplicate|unique/i.test(result.error.message || '')
          ? 'That area is already on the list.'
          : (result.error.message || 'Could not save.');
        return;
      }
      renderAreas(done);
    }

    // ---- New order: taken on WhatsApp or by phone ----
    const NO_SLOTS = {
      delivery: ['12:00-16:00', '18:00-23:00'],
      pickup: ['10:00-14:00', '16:00-21:00'],
      pickupFriday: ['13:00-18:00']
    };
    const NO_DELIVERY_FEE = 30;  // until an area is picked
    let catalog = null;      // products with their sizes, loaded when the form opens
    let draftItems = [];     // [{ variant_id, label, price, quantity }]
    let noGiftWasOn = false;

    // Flavours of the Premium and Luxury boxes (same as the box pages on the website).
    const BOX_FLAVOURS = {
      Premium: ['Carmelitto Di QAVERA', 'Noccelle Di QAVERA', 'Pistachio Royal', 'Caffezinho', 'Manga Di QAVERA', 'Fragola Di QAVERA'],
      Luxury: ['Mouhalabia Fustuq', 'Cheesecake', 'Nocciolla Coffee', 'Raspberry Dunkel', 'Mango Passion', 'Matcha-cha']
    };
    let flavourCounts = [];

    async function loadCatalog() {
      const { data, error } = await adminSupabase
        .from('products')
        .select('id, name, in_stock, product_variants(id, name, price, active, pieces)')
        .eq('active', true)
        .order('name');
      if (error) throw error;
      return (data || []).flatMap(p => (p.product_variants || [])
        .filter(v => v.active !== false)
        .sort((a, b) => Number(a.price) - Number(b.price))
        .map(v => ({
          id: v.id, label: `${p.name} — ${v.name}`, price: Number(v.price), soldOut: p.in_stock === false,
          pieces: Number(v.pieces) || 0, flavours: Number(v.pieces) ? (BOX_FLAVOURS[p.name] || null) : null
        })));
    }

    async function renderNewOrder() {
      content.innerHTML = '<div class="notice"><p>Loading products…</p></div>';
      try {
        catalog = await loadCatalog();
        areas = await loadAreas().catch(() => areas);
      } catch (error) {
        content.innerHTML = `<div class="notice"><h2>Could not load products</h2><p>${escapeHtml(error.message)}</p></div>`;
        return;
      }
      if (activeFilter !== 'new') return;
      draftItems = [];
      noGiftWasOn = false;
      const options = catalog.map(v => `<option value="${v.id}" ${v.soldOut ? 'disabled' : ''}>${escapeHtml(v.label)} · ${qar(v.price)}${v.soldOut ? ' (sold out)' : ''}</option>`).join('');

      content.innerHTML = `
        <form class="new-order" id="newOrderForm" novalidate>
          <p class="stock-intro" style="margin:0;">For orders taken on WhatsApp or by phone. It is added to <strong>To do</strong> like a website order.</p>

          <div class="no-section">
            <div class="block-label">Customer</div>
            <div class="no-grid">
              <div class="no-field"><label for="noName">Name *</label><input id="noName" autocomplete="off"></div>
              <div class="no-field"><label for="noPhone">Phone *</label><input id="noPhone" type="tel" placeholder="+974 …" autocomplete="off"></div>
            </div>
          </div>

          <div class="no-section">
            <div class="block-label">Products</div>
            <div class="no-add">
              <div class="no-field"><label for="noProduct">Product</label><select id="noProduct"><option value="">Choose a product…</option>${options}</select></div>
              <div class="no-field"><label for="noQty">Qty</label><input id="noQty" type="number" min="1" value="1"></div>
              <button type="button" class="action primary" data-no="add">Add</button>
            </div>
            <div class="no-flavours" id="noFlavours" hidden></div>
            <ul class="no-items" id="noItems"></ul>
          </div>

          <div class="no-section">
            <div class="block-label">Delivery or pickup</div>
            <div class="no-choice">
              <label><input type="radio" name="noFulfillment" value="delivery" checked> Delivery</label>
              <label><input type="radio" name="noFulfillment" value="pickup"> Pickup from the shop</label>
            </div>
            <label class="no-check" id="noGiftRow"><input type="checkbox" id="noGift"> 🎁 Gift: deliver to someone else</label>
            <div class="no-grid" id="noGiftFields" hidden>
              <div class="no-field"><label for="noGiftName">Recipient's name *</label><input id="noGiftName" autocomplete="off"></div>
              <div class="no-field"><label for="noGiftPhone">Recipient's phone *</label><input id="noGiftPhone" type="tel" placeholder="+974 …" autocomplete="off"></div>
              <div class="no-field" style="grid-column:1/-1"><label for="noGiftMessage">Gift message (optional)</label><input id="noGiftMessage" maxlength="300" placeholder="Written on a card"></div>
            </div>
            <div class="no-grid" id="noAddress">
              <div class="no-field"><label for="noArea">Area *</label><input id="noArea" list="noAreaList" placeholder="Start typing, e.g. Lusail" autocomplete="off"><datalist id="noAreaList">${(areas || []).map(a => `<option value="${escapeHtml(a.name)}">QAR ${Number(a.fee)}</option>`).join('')}</datalist></div>
              <div class="no-field"><label for="noStreet">Address *</label><input id="noStreet" placeholder="Zone, street"></div>
              <div class="no-field"><label for="noBuilding">Building / villa</label><input id="noBuilding"></div>
              <div class="no-field"><label for="noApartment">Apartment / floor</label><input id="noApartment"></div>
            </div>
            <div class="no-grid">
              <div class="no-field"><label for="noDate">Date *</label><input id="noDate" type="date" value="${qatarDayOffset(1)}"></div>
              <div class="no-field"><label for="noSlot">Time *</label><select id="noSlot"></select></div>
            </div>
          </div>

          <div class="no-section">
            <div class="block-label">Price</div>
            <div class="no-grid">
              <div class="no-field"><label for="noDiscount">Discount %</label><input id="noDiscount" type="number" min="0" max="100" step="1" value="0"></div>
              <div class="no-field" id="noFeeField"><label for="noFee">Delivery charge (QAR)</label><input id="noFee" type="number" min="0" step="1" value="${NO_DELIVERY_FEE}"></div>
              <div class="no-field"><label for="noPayment">Payment</label><select id="noPayment">
                <option value="cash_on_delivery">Cash on delivery / pickup</option>
                <option value="card_on_delivery">Card on delivery / pickup</option>
                <option value="fawran">Fawran (paid in advance)</option>
              </select></div>
              <div class="no-field"><label for="noNotes">Notes</label><input id="noNotes" placeholder="Optional"></div>
            </div>
            <div class="no-totals" id="noTotals"></div>
          </div>

          <div class="no-message" id="noMessage" role="alert"></div>
          <div><button type="submit" class="action primary" id="noSubmit">Create order</button></div>
        </form>`;

      const form = document.getElementById('newOrderForm');
      document.getElementById('noProduct').addEventListener('change', renderFlavours);
      // Picking a known area fills in its delivery charge (it can still be changed).
      document.getElementById('noArea').addEventListener('input', event => {
        const area = (areas || []).find(a => a.name.toLowerCase() === event.target.value.trim().toLowerCase());
        if (area) document.getElementById('noFee').value = Number(area.fee);
      });
      form.addEventListener('input', updateNewOrder);
      form.addEventListener('change', updateNewOrder);
      form.addEventListener('submit', event => { event.preventDefault(); submitNewOrder(); });
      updateNewOrder();
    }

    const noValue = id => document.getElementById(id).value.trim();
    const noPickup = () => document.querySelector('input[name="noFulfillment"]:checked')?.value === 'pickup';

    function noTotals() {
      const subtotal = draftItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const percent = Math.min(Math.max(Number(noValue('noDiscount')) || 0, 0), 100);
      const discount = Math.round(subtotal * percent) / 100;
      const delivery = noPickup() ? 0 : Math.max(Number(noValue('noFee')) || 0, 0);
      return { subtotal, percent, discount, delivery, total: subtotal - discount + delivery };
    }

    function updateNewOrder() {
      const pickup = noPickup();
      document.getElementById('noAddress').hidden = pickup;
      document.getElementById('noGiftRow').hidden = pickup;
      const gift = !pickup && document.getElementById('noGift').checked;
      document.getElementById('noGiftFields').hidden = !gift;
      // Gifts are paid by Fawran: switch to it once when the box is ticked.
      if (gift && !noGiftWasOn) document.getElementById('noPayment').value = 'fawran';
      noGiftWasOn = gift;
      document.getElementById('noFeeField').hidden = pickup;

      // Times depend on delivery / pickup and on Fridays for pickup.
      const date = document.getElementById('noDate').value;
      const friday = !!date && new Date(`${date}T12:00:00Z`).getUTCDay() === 5;
      const slots = pickup ? (friday ? NO_SLOTS.pickupFriday : NO_SLOTS.pickup) : NO_SLOTS.delivery;
      const slotSelect = document.getElementById('noSlot');
      if (slotSelect.dataset.slots !== slots.join()) {
        const previous = slotSelect.value;
        slotSelect.innerHTML = slots.map(s => `<option value="${s}">${SLOT_LABELS[s]}</option>`).join('');
        if (slots.includes(previous)) slotSelect.value = previous;
        slotSelect.dataset.slots = slots.join();
      }

      document.getElementById('noItems').innerHTML = draftItems.map((item, i) => `
        <li><span>${escapeHtml(item.label)} × ${item.quantity}${item.flavors
          ? `<span class="no-flv-list">${item.flavors.map(f => `${escapeHtml(f.name)} × ${f.quantity}`).join(', ')}</span>`
          : (catalog.find(v => v.id === item.variant_id)?.flavours ? `<span class="no-flv-list">Chef's selection</span>` : '')}</span>
          <span>${qar(item.price * item.quantity)} <button type="button" data-no="remove" data-index="${i}">Remove</button></span></li>`).join('');

      const t = noTotals();
      document.getElementById('noTotals').innerHTML = `
        <div><span>Subtotal</span><span>${qar(t.subtotal)}</span></div>
        ${t.discount > 0 ? `<div><span>Discount ${t.percent}%</span><span>− ${qar(t.discount)}</span></div>` : ''}
        <div><span>${pickup ? 'Pickup' : 'Delivery'}</span><span>${pickup ? 'Free' : qar(t.delivery)}</span></div>
        <div class="grand"><span>Total</span><span>${qar(t.total)}</span></div>`;
    }

    // Box flavours: optional; empty = chef's selection, otherwise must fill the box.
    function renderFlavours(keepCounts) {
      const panel = document.getElementById('noFlavours');
      const variant = catalog.find(v => v.id === document.getElementById('noProduct').value);
      if (!variant || !variant.flavours) { panel.hidden = true; panel.innerHTML = ''; flavourCounts = []; return; }
      if (keepCounts !== true || flavourCounts.length !== variant.flavours.length) flavourCounts = variant.flavours.map(() => 0);
      const total = flavourCounts.reduce((a, b) => a + b, 0);
      panel.hidden = false;
      panel.innerHTML = `
        <div class="no-flv-head">
          <strong>Flavours</strong> <span>${total} / ${variant.pieces} pieces · leave at 0 for chef's selection</span>
          <button type="button" data-no="flv-even">Even mix</button>
          <button type="button" data-no="flv-clear">Clear</button>
        </div>
        ${variant.flavours.map((name, i) => `<div class="no-flv-row">
          <span>${escapeHtml(name)}</span>
          <button type="button" data-no="flv" data-i="${i}" data-d="-1" ${flavourCounts[i] <= 0 ? 'disabled' : ''}>−</button>
          <b>${flavourCounts[i]}</b>
          <button type="button" data-no="flv" data-i="${i}" data-d="1" ${total >= variant.pieces ? 'disabled' : ''}>+</button>
        </div>`).join('')}
        <div class="no-flv-note" id="noFlvNote">${total && total !== variant.pieces ? `Choose ${variant.pieces - total} more piece${variant.pieces - total === 1 ? '' : 's'}.` : ''}</div>`;
    }

    function newOrderClick(event) {
      const button = event.target.closest('[data-no]');
      if (!button) return;
      const message = document.getElementById('noMessage');
      message.textContent = '';
      message.classList.remove('ok');
      if (button.dataset.no.startsWith('flv')) {
        const variant = catalog.find(v => v.id === document.getElementById('noProduct').value);
        if (!variant || !variant.flavours) return;
        if (button.dataset.no === 'flv') {
          const total = flavourCounts.reduce((a, b) => a + b, 0);
          const i = Number(button.dataset.i), d = Number(button.dataset.d);
          if (d > 0 && total < variant.pieces) flavourCounts[i] += 1;
          if (d < 0 && flavourCounts[i] > 0) flavourCounts[i] -= 1;
        } else if (button.dataset.no === 'flv-even') {
          const n = variant.flavours.length;
          flavourCounts = variant.flavours.map((_, i) => Math.floor(variant.pieces / n) + (i < variant.pieces % n ? 1 : 0));
        } else {
          flavourCounts = variant.flavours.map(() => 0);
        }
        renderFlavours(true);
        return;
      }
      if (button.dataset.no === 'add') {
        const variant = catalog.find(v => v.id === document.getElementById('noProduct').value);
        const quantity = Math.floor(Number(document.getElementById('noQty').value));
        if (!variant) { message.textContent = 'Choose a product.'; return; }
        if (!(quantity > 0)) { message.textContent = 'Enter a quantity.'; return; }
        const chosen = variant.flavours ? flavourCounts.reduce((a, b) => a + b, 0) : 0;
        if (chosen && chosen !== variant.pieces) {
          document.getElementById('noFlvNote').textContent = `The flavours must add up to ${variant.pieces} pieces (now ${chosen}).`;
          return;
        }
        const flavors = chosen ? variant.flavours.map((name, i) => ({ name, quantity: flavourCounts[i] })).filter(f => f.quantity > 0) : null;
        const existing = !flavors && draftItems.find(item => item.variant_id === variant.id && !item.flavors);
        if (existing) existing.quantity += quantity;
        else draftItems.push({ variant_id: variant.id, label: variant.label, price: variant.price, quantity, flavors });
        document.getElementById('noProduct').value = '';
        document.getElementById('noQty').value = 1;
        renderFlavours();
      } else if (button.dataset.no === 'remove') {
        draftItems.splice(Number(button.dataset.index), 1);
      }
      updateNewOrder();
    }

    async function submitNewOrder() {
      const message = document.getElementById('noMessage');
      const submit = document.getElementById('noSubmit');
      message.classList.remove('ok');
      const pickup = noPickup();
      const missing = [];
      if (!noValue('noName')) missing.push('name');
      if (!noValue('noPhone')) missing.push('phone');
      if (!draftItems.length) missing.push('at least one product');
      if (!pickup && !noValue('noArea')) missing.push('area');
      if (!pickup && !noValue('noStreet')) missing.push('address');
      if (!noValue('noDate')) missing.push('date');
      const gift = !pickup && document.getElementById('noGift').checked;
      if (gift && !noValue('noGiftName')) missing.push("recipient's name");
      if (gift && !noValue('noGiftPhone')) missing.push("recipient's phone");
      if (missing.length) { message.textContent = `Please add: ${missing.join(', ')}.`; return; }

      const t = noTotals();
      submit.disabled = true;
      message.textContent = '';
      const { data, error } = await adminSupabase.rpc('admin_create_order', {
        p_customer_name: noValue('noName'),
        p_customer_phone: noValue('noPhone'),
        p_fulfillment: pickup ? 'pickup' : 'delivery',
        p_delivery_area: pickup ? null : noValue('noArea'),
        p_delivery_address: pickup ? null : noValue('noStreet'),
        p_building: pickup ? null : noValue('noBuilding'),
        p_apartment: pickup ? null : noValue('noApartment'),
        p_scheduled_date: noValue('noDate'),
        p_time_slot: document.getElementById('noSlot').value,
        p_items: draftItems.map(item => ({ variant_id: item.variant_id, quantity: item.quantity, flavors: item.flavors || null })),
        p_discount_percent: t.percent,
        p_discount_reason: t.percent > 0 ? `${t.percent}% off · WhatsApp` : null,
        p_delivery_fee: t.delivery,
        p_payment_method: document.getElementById('noPayment').value,
        p_notes: noValue('noNotes') || null,
        ...(gift ? {
          p_gift: true,
          p_gift_name: noValue('noGiftName'),
          p_gift_phone: noValue('noGiftPhone'),
          p_gift_message: noValue('noGiftMessage') || null
        } : {})
      });
      submit.disabled = false;

      if (error) {
        console.error('Could not create order:', error);
        message.textContent = /admin_create_order/.test(error.message || '')
          ? 'Run 027_admin_new_order.sql in Supabase first.'
          : (error.message || 'Could not create this order.');
        return;
      }

      const created = Array.isArray(data) ? data[0] : data;
      activeFilter = 'active';
      await loadOrders();
      subtitle.textContent = `Order ${created?.order_number || ''} added · total ${qar(created?.total)}`;
    }

    async function setPaid(button) {
      const message = document.getElementById(`msg-${button.dataset.paid}`);
      button.disabled = true;
      const { error } = await adminSupabase.rpc('admin_set_payment_status', {
        p_order_id: button.dataset.paid,
        p_paid: button.dataset.value === 'true'
      });
      if (error) {
        console.error('Could not update payment:', error);
        if (message) message.textContent = error.message || 'Could not update the payment.';
        button.disabled = false;
        return;
      }
      await loadOrders();
    }

    async function setStatus(button) {
      const orderId = button.dataset.id;
      const status = button.dataset.status;
      const message = document.getElementById(`msg-${orderId}`);

      // Cancelling needs a second tap so it can't happen by accident.
      if (status === 'cancelled' && !button.classList.contains('armed')) {
        button.classList.add('armed');
        button.textContent = 'Tap again to cancel';
        setTimeout(() => {
          if (button.isConnected) {
            button.classList.remove('armed');
            button.textContent = 'Cancel order';
          }
        }, 4000);
        return;
      }

      button.closest('.actions').querySelectorAll('button').forEach(b => { b.disabled = true; });
      if (message) message.textContent = '';

      const { error } = await adminSupabase.rpc('admin_set_order_status', {
        p_order_id: orderId,
        p_status: status
      });

      if (error) {
        console.error('Could not update order:', error);
        if (message) message.textContent = error.message || 'Could not update this order.';
        button.closest('.actions').querySelectorAll('button').forEach(b => { b.disabled = false; });
        return;
      }

      await loadOrders();
    }

    filtersEl.addEventListener('click', event => {
      const button = event.target.closest('.filter');
      if (!button) return;
      activeFilter = button.dataset.filter;
      render();
    });

    content.addEventListener('click', event => {
      if (event.target.closest('#newOrderForm')) { newOrderClick(event); return; }
      if (event.target.closest('#areasPanel')) { areasClick(event); return; }
      const invoiceButton = event.target.closest('[data-invoice]');
      if (invoiceButton) {
        const order = orders.find(o => o.id === invoiceButton.dataset.invoice);
        if (order) openInvoice(order);
        return;
      }
      const paidButton = event.target.closest('[data-paid]');
      if (paidButton) { setPaid(paidButton); return; }
      const stockButton = event.target.closest('.stock-toggle');
      if (stockButton) { setStock(stockButton); return; }
      const button = event.target.closest('.action');
      if (button) setStatus(button);
    });

    document.getElementById('refreshButton').addEventListener('click', loadOrders);

    document.getElementById('dayFrom').addEventListener('change', event => {
      dayFrom = event.target.value || '';
      if (dayFrom && dayTo && dayTo < dayFrom) dayTo = dayFrom;
      render();
    });
    document.getElementById('dayTo').addEventListener('change', event => {
      dayTo = event.target.value || '';
      if (dayFrom && dayTo && dayFrom > dayTo) dayFrom = dayTo;
      render();
    });
    document.getElementById('dayBar').addEventListener('click', event => {
      const button = event.target.closest('[data-day]');
      if (!button) return;
      const key = button.dataset.day;
      dayFrom = dayTo = key === 'today' ? qatarDayOffset(0) : key === 'tomorrow' ? qatarDayOffset(1) : '';
      render();
    });
    document.getElementById('printButton').addEventListener('click', () => window.print());

    document.getElementById('logoutButton').addEventListener('click', async () => {
      await adminSupabase.auth.signOut();
      window.location.replace('login.html?next=admin.html');
    });

    init();
  </script>
</body>
</html>
