<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — QAVERA</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="v3/qavera.css?v=20260930b">
  <link rel="stylesheet" href="v3/auth.css?v=20260930">
</head>
<body data-page="account" data-no-footer data-no-loader>
  <script src="v3/qavera.js?v=20261008b"></script>

  <main class="v3-main">
    <section class="auth">
      <div class="auth-art">
        <img src="cacaobean.jpeg" alt="A cocoa pod">
        <div class="auth-quote">
          <p class="caption">QAVERA account</p>
          <p class="display">A fresh <em>start</em>.</p>
        </div>
      </div>

      <div class="auth-panel">
        <div class="auth-card" id="resetSection">
          <p class="caption kicker">Account security</p>
          <h1 class="display">New <em>password</em>.</h1>
          <p class="intro">Create a new password for your QAVERA account.</p>

          <form class="auth-form" id="resetForm" novalidate>
            <div class="v3-field">
              <label for="newPassword">New password</label>
              <div class="pw-wrap">
                <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 6 characters" required>
                <button type="button" class="pw-toggle" data-toggle="newPassword" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/><path class="slash" d="M4 4l16 16"/></svg>
                </button>
              </div>
            </div>
            <div class="v3-field">
              <label for="confirmPassword">Confirm new password</label>
              <div class="pw-wrap">
                <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Type it again" required>
                <button type="button" class="pw-toggle" data-toggle="confirmPassword" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/><path class="slash" d="M4 4l16 16"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-solid btn-block" id="updateButton">Update password <span class="arrow">→</span></button>
            <div class="auth-foot"><a class="link" href="login.html">Back to sign in</a></div>
          </form>
          <p class="auth-message" id="message" role="alert"></p>
        </div>

        <div class="auth-card hidden" id="expiredSection">
          <p class="caption kicker">Link expired</p>
          <h1 class="display">This link has <em>expired</em>.</h1>
          <p class="intro">This password reset link is no longer valid. Please request a new one from the sign-in page.</p>
          <a class="btn btn-solid btn-block" href="login.html">Request a new link <span class="arrow">→</span></a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://rhwajaceuhpfwughlgpd.supabase.co',
      'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0'
    );

    const $ = id => document.getElementById(id);
    const message = $('message');

    function showExpired() {
      $('resetSection').classList.add('hidden');
      $('expiredSection').classList.remove('hidden');
    }

    document.querySelectorAll('.pw-toggle').forEach(button => {
      button.addEventListener('click', () => {
        const input = $(button.dataset.toggle);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        button.classList.toggle('showing', !showing);
        button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    });

    // Supabase reads the recovery token from the link and opens a temporary session.
    supabaseClient.auth.onAuthStateChange(event => {
      if (event === 'PASSWORD_RECOVERY') {
        $('resetSection').classList.remove('hidden');
        $('expiredSection').classList.add('hidden');
      }
    });

    (async function verifyRecoverySession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        setTimeout(async () => {
          const { data: { session: retry } } = await supabaseClient.auth.getSession();
          if (!retry) showExpired();
        }, 1200);
      }
    })();

    $('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      message.classList.remove('ok');

      const password = $('newPassword').value;
      if (password !== $('confirmPassword').value) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      if (password.length < 6) {
        message.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const button = $('updateButton');
      button.disabled = true;
      button.textContent = 'Updating…';

      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.innerHTML = 'Update password <span class="arrow">→</span>';
        return;
      }

      message.textContent = 'Password updated. Taking you to sign in…';
      message.classList.add('ok');
      await supabaseClient.auth.signOut();
      setTimeout(() => window.location.replace(`${window.location.origin}/login.html`), 1200);
    });
  </script>
</body>
</html>
