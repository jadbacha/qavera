<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | QAVERA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --beige: #F5EDD9;
      --beige-light: #FAF5EA;
      --beige-mid: #EBE0C4;
      --black: #0D0B08;
      --charcoal: #1A1713;
      --gold: #C9A84C;
      --gold-light: #E2C97E;
      --gold-dark: #9A7A2E;
      --text-dark: #1A1713;
      --text-muted: #6B5F45;
      --muted: rgba(245, 237, 217, 0.58);
      --border: rgba(201, 168, 76, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--beige);
      font-family: 'Jost', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .reset-container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 400px;
      height: 58px;
      margin: 0 auto 16px;
      text-decoration: none;
    }

    .logo img {
      width: 450px;
      height: auto;
      max-height: 230px;
      object-fit: contain;
      display: block;
      transition: opacity .3s ease;
      margin-bottom: 100px;
    }

    .logo:hover img {
      opacity: .8;
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 45px;
      margin-top: 20px;
    }

    .reset-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .intro {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245, 237, 217, 0.65);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      width: 100%;
      height: 52px;
      padding: 0 50px 0 15px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--beige);
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .password-wrap input:focus {
      border-color: var(--gold);
    }

    .password-wrap input::placeholder {
      color: rgba(245, 237, 217, 0.3);
    }

    .eye-btn {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      border: 0;
      background: transparent;
      color: rgba(245, 237, 217, 0.65);
      cursor: pointer;
      padding: 2px;
    }

    .eye-btn:hover {
      color: var(--gold);
    }

    .eye-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .update-btn {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--black);
      font-family: 'Jost', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .update-btn:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .update-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      min-height: 20px;
      font-size: 0.7rem;
      color: var(--gold-light);
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: rgba(245, 237, 217, 0.65);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .hidden {
      display: none !important;
    }

    .reset-container {
      position: relative;
    }


    .subtitle {
      color: var(--text-muted);
    }

    .message {
      color: var(--gold-dark);
    }

    .update-btn {
      letter-spacing: .22em;
    }

@media (max-width: 600px) {
  body {
    padding: 30px 22px;
  }

  .logo {
    width: 80vw;
    max-width: 500px;
    height: auto;
    margin: 80px auto !important;
    display: block;
  }

  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  #resetSection {
    margin-top: -20px !important;
  }

  .reset-title {
    font-size: 2.2rem;
    margin-top: 0 !important;
  }
}
html,
  body {
    height: 100%;
    overflow: hidden;
  }
  </style>
</head>

<body>

  <main class="reset-container">

    <a href="home.html" class="logo" aria-label="QAVERA Home">
      <img src="Qavera Logotype .png" alt="QAVERA">
    </a>


    <section id="resetSection">
      <h1 class="reset-title">Reset Password</h1>

      <p class="intro">
        Create a new password for your QAVERA account.
      </p>

      <form id="resetForm">

        <div class="form-group">
          <label for="newPassword">New Password</label>

          <div class="password-wrap">
            <input
              type="password"
              id="newPassword"
              placeholder="New password"
              minlength="6"
              required
            >

            <button type="button" class="eye-btn" id="newPasswordEye" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
                <path id="newSlash" d="M4 4L20 20"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>

          <div class="password-wrap">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
              minlength="6"
              required
            >

            <button type="button" class="eye-btn" id="confirmPasswordEye" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
                <path id="confirmSlash" d="M4 4L20 20"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="update-btn" id="updateButton">
          Update Password
        </button>

      </form>

      <div class="message" id="message"></div>
      <a href="login.html" class="back-link">Back to Sign In</a>
    </section>

    <section id="expiredSection" class="hidden">
      <h1 class="reset-title">Link Expired</h1>

      <p class="intro">
        This password reset link is no longer valid.<br>
        Please request a new one from the sign-in page.
      </p>

      <a href="login.html" class="update-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">
        Request New Link
      </a>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://rhwajaceuhpfwughlgpd.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_z19paX78926eQBcMOLw-dA_T8um0KS0';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const resetForm = document.getElementById('resetForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const updateButton = document.getElementById('updateButton');
    const message = document.getElementById('message');
    const resetSection = document.getElementById('resetSection');
    const expiredSection = document.getElementById('expiredSection');

    function showExpired() {
      resetSection.classList.add('hidden');
      expiredSection.classList.remove('hidden');
    }

    function setupPasswordToggle(buttonId, inputId, slashId) {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      const slash = document.getElementById(slashId);

      button.addEventListener('click', () => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        slash.style.display = visible ? 'block' : 'none';
        button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      });
    }

    setupPasswordToggle('newPasswordEye', 'newPassword', 'newSlash');
    setupPasswordToggle('confirmPasswordEye', 'confirmPassword', 'confirmSlash');

    // Supabase processes the recovery token from the URL hash and creates
    // the temporary recovery session automatically.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        resetSection.classList.remove('hidden');
        expiredSection.classList.add('hidden');
      }
    });

    async function verifyRecoverySession() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        // Give the URL hash/session processing a moment before showing expired.
        setTimeout(async () => {
          const { data: { session: retrySession } } = await supabaseClient.auth.getSession();
          if (!retrySession) {
            showExpired();
          }
        }, 1200);
      }
    }

    verifyRecoverySession();

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      message.textContent = '';

      if (newPassword.value !== confirmPassword.value) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      if (newPassword.value.length < 6) {
        message.textContent = 'Password must be at least 6 characters.';
        return;
      }

      updateButton.disabled = true;
      updateButton.textContent = 'Updating...';

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword.value
      });

      if (error) {
        message.textContent = error.message;
        updateButton.disabled = false;
        updateButton.textContent = 'Update Password';
        return;
      }

      message.textContent = 'Password updated successfully. Redirecting...';

      await supabaseClient.auth.signOut();

      setTimeout(() => {
        window.location.replace(window.location.origin + '/login.html');
      }, 1200);
    });
  </script>

</body>
</html>
